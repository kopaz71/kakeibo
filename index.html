<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カード明細家計簿</title>
<meta name="theme-color" content="#1c6a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaeee9; --ink:#17201b; --ink-2:#4a5550; --muted:#78837d;
  --line:#dbe1dc; --accent:#1c6a55; --accent-hover:#155443; --accent-soft:#d9ece5; --accent-ink:#ffffff;
  --bar:#2d7a65; --bar-dim:#bcd5cc; --grid:#e4e8e4;
  --warn:#9a5208; --warn-soft:#fbeedc; --danger:#b3261e; --danger-soft:#f9e1de; --good:#1d6f36;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 4px 16px rgba(20,32,27,.05);
  --pig:#e98ea6; --pig-ink:#6b2438;
  --sans:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","Roboto Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1311; --surface:#161b18; --surface-2:#1e2521; --ink:#e6ebe8; --ink-2:#b2bcb6; --muted:#84908a;
    --line:#29312d; --accent:#5ec2a2; --accent-hover:#7ad1b5; --accent-soft:#1b3830; --accent-ink:#0b1813;
    --bar:#4fb192; --bar-dim:#2c4a40; --grid:#232b27;
    --warn:#f0a750; --warn-soft:#382916; --danger:#f07167; --danger-soft:#3a1d1a; --good:#6fd08c;
    --shadow:0 1px 2px rgba(0,0,0,.3); --pig:#f0a3b8; --pig-ink:#4a1626;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1311; --surface:#161b18; --surface-2:#1e2521; --ink:#e6ebe8; --ink-2:#b2bcb6; --muted:#84908a;
  --line:#29312d; --accent:#5ec2a2; --accent-hover:#7ad1b5; --accent-soft:#1b3830; --accent-ink:#0b1813;
  --bar:#4fb192; --bar-dim:#2c4a40; --grid:#232b27;
  --warn:#f0a750; --warn-soft:#382916; --danger:#f07167; --danger-soft:#3a1d1a; --good:#6fd08c;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pig:#f0a3b8; --pig-ink:#4a1626;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px));padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:12px;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:7px;cursor:pointer;font-size:18px;color:var(--ink-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .m{min-width:112px;text-align:center;font-weight:700;font-size:15px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabs button{border:0;background:transparent;padding:8px 2px 9px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabs .badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0!important}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;line-height:18px;text-align:center}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}
.banner.warn{background:var(--warn-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}

/* summary */
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 32px;padding:4px 2px 20px}
.mstrip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;margin-bottom:12px}
.mstrip .side{border:0;background:transparent;display:flex;flex-direction:column;gap:1px;padding:8px 6px;border-radius:10px;cursor:pointer;color:var(--ink-2);min-width:0}
.mstrip .side:active{background:var(--surface-2)}
.mstrip .prev{align-items:flex-start;text-align:left}
.mstrip .next{align-items:flex-end;text-align:right}
.mstrip .side .ml{font-size:12px;white-space:nowrap}
.mstrip .side .mv{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mstrip .side .mv.none{color:var(--muted);font-family:var(--sans);font-size:12px}
.mstrip .center{text-align:center;min-width:0}
.mstrip .center .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.mstrip .center .val{font-family:var(--mono);font-size:clamp(24px,8vw,34px);font-weight:600;line-height:1.15;letter-spacing:-.02em;white-space:nowrap}
.mstrip .center .val .yen{font-size:.55em;margin-right:2px;color:var(--ink-2)}
.meta.solo{justify-content:center;padding:0 2px 18px}
.total .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.total .val{font-family:var(--mono);font-size:clamp(32px,7vw,44px);font-weight:600;line-height:1.1;letter-spacing:-.02em}
.total .val .yen{font-size:.55em;margin-right:2px;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--ink-2);padding-bottom:4px}
.meta b{font-weight:600;color:var(--ink)}
.delta.up{color:var(--danger)} .delta.down{color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;cursor:pointer;background:var(--warn-soft);color:var(--warn)}
.chip:hover{filter:brightness(.97)}

/* category bars */
.donut{position:relative;width:min(64vw,220px);aspect-ratio:1;margin:4px auto 14px}
.donut svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none}
.donut .bgr{stroke:var(--grid)}
.donut .sl{cursor:pointer}
.donut .sl:hover{filter:brightness(.92)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut .ctr span{font-size:12px;color:var(--muted)}
.donut .ctr b{font-size:clamp(17px,5.4vw,21px);font-weight:700;color:var(--ink)}
.cbars{display:flex;flex-direction:column;gap:2px}
.cbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 6px;border-radius:7px;border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.cbar:hover{background:var(--surface-2)}
.cbar .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .v{font-size:13px;text-align:right;white-space:nowrap}
.cbar .v span{color:var(--muted);font-size:11px;margin-left:6px;display:inline-block;min-width:3.2em}

/* trend */
.trend{position:relative;height:190px;margin-top:4px;padding-left:42px}
.trend .gl{position:absolute;left:42px;right:0;border-top:1px solid var(--grid)}
.trend .gl.base{border-top-color:var(--line)}
.trend .gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.cols{position:absolute;left:42px;right:0;top:0;bottom:22px;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default;border:0;background:transparent;padding:0}
.col .b{width:min(70%,28px);background:var(--bar-dim);border-radius:4px 4px 0 0;min-height:0}
.col.cur .b{background:var(--bar)}
.col:hover .b{filter:brightness(.92)}
.col .x{position:absolute;bottom:-20px;font-size:10px;color:var(--muted);white-space:nowrap}
.col.cur .x{color:var(--ink);font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}

.shops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shops li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.shops li:first-child{border-top:0}
.shops .c{color:var(--muted);font-size:11px;margin-left:6px}

/* list */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 180px}
input[type=text],input[type=search],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
input:focus,select:focus{border-color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:3px 10px;min-height:30px;font-size:12px}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:5.2em minmax(0,1fr) 10em 7.5em 32px;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row .d{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.row .nm{min-width:0}
.row .nm .t{overflow-wrap:anywhere}
.row .nm .memo{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.row .tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.row .a{text-align:right;font-size:14px}
.row .a.neg{color:var(--good)}
.row select{width:100%;min-height:32px;padding:4px 8px;font-size:13px}
.row select.unset{border-color:var(--warn);color:var(--warn);font-weight:700}
.row.head{font-size:11px;color:var(--muted);padding-block:4px;border-bottom:1px solid var(--line)}
.listfoot{display:flex;justify-content:space-between;padding:10px 4px;font-size:13px;color:var(--ink-2)}
@media all{
  .row{grid-template-columns:minmax(0,1fr) auto 30px;grid-template-areas:"nm a x" "d c c";row-gap:6px}
  .row .nm{grid-area:nm}.row .a{grid-area:a}.row .icon-btn{grid-area:x}
  .row .d{grid-area:d}.row .cat{grid-area:c}
  .row.head{display:none}
}

.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.addform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.addform input,.addform select{width:100%}
details.add{margin-bottom:14px}
details.add summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);padding:4px 0;list-style:none}
details.add summary::before{content:"＋ "}
details.add[open] summary::before{content:"－ "}
details.add .addform{padding:12px;background:var(--surface-2);border-radius:10px;margin-top:6px}

/* import */
.drop{border:2px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0 14px;color:var(--ink-2)}
.drop .big{font-size:16px;font-weight:700;color:var(--ink);margin:0}
.steps{margin:0;padding-left:1.4em;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.result{display:flex;flex-direction:column;gap:6px}
.result .file{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.result .file:first-child{border-top:0}
.result .err{color:var(--danger)}
.stat{display:inline-flex;gap:4px;align-items:baseline}
.stat b{font-family:var(--mono)}

/* settings */
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:auto minmax(0,1fr) 4em auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow input{width:100%}
.setrow .cnt{font-size:12px;color:var(--muted);text-align:right}
.rulerow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9.5em) 30px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.rulerow:first-child{border-top:0}
.rulerow input,.rulerow select{width:100%;min-height:32px;padding:4px 8px}
.rulebox{max-height:420px;overflow-y:auto;padding-right:4px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input[type=text]{flex:1 1 140px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--danger-soft);border-radius:8px;margin-top:10px;font-size:13px}
.store{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:10;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .2s ease-out}@keyframes rise{from{transform:translate(-50%,8px);opacity:0}}}

/* piggy mark */
.brand{align-items:center}
.pig{width:30px;height:30px;flex:none}
.pig .bg{fill:#e8783a}.pig .pg{fill:#faf6ec}.pig .sp{fill:#e2d6be}.pig .ln{fill:#aaa091}.pig .pc{fill:#ffcd40}

/* category icons */
.ci{display:inline-grid;place-items:center;flex:none;width:var(--s,24px);height:var(--s,24px);border-radius:50%;background:var(--c,#6f7b75)}
.ci svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cbar .n{display:flex;align-items:center;gap:8px;min-width:0}
.cbar .n b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.row .cat{display:flex;align-items:center;gap:8px;min-width:0}
.row .cat select{flex:1;min-width:0}
.iconbtn{border:0;background:transparent;padding:2px;border-radius:50%;cursor:pointer}
.iconbtn .ci{--s:34px}
.picker{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;padding:12px;background:var(--surface-2);border-radius:10px;margin-top:4px}
.picker button{border:2px solid transparent;background:transparent;border-radius:50%;padding:3px;cursor:pointer;justify-self:center}
.picker button[aria-pressed="true"]{border-color:var(--ink)}
.picker .ci{--s:34px}

/* category trend */
.chips{display:flex;gap:6px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chips button.none[aria-pressed="false"]{color:var(--warn)}
.ctsum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2);margin:2px 0 16px}
.ctsum b{color:var(--ink);font-weight:600}
.ctsum .up{color:var(--danger)} .ctsum .down{color:var(--good)}
.trend .avg{position:absolute;left:42px;right:0;border-top:1.5px dashed var(--ink-2);z-index:2;pointer-events:none;opacity:.7}
.trend .avg span{position:absolute;right:0;top:-18px;font-size:10px;color:var(--ink-2);background:var(--surface);padding:0 4px;border-radius:3px;font-family:var(--mono)}

/* motion */
#view{touch-action:pan-y}
@media (prefers-reduced-motion:no-preference){
  #view.grow .donut .sweep{animation:sweep .8s cubic-bezier(.3,.7,.2,1) .08s both}
  #view.grow .col .b, .trend.grow .col .b{animation:gy .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom;animation-delay:calc(var(--i,0) * 35ms + 120ms)}
  @keyframes sweep{from{stroke-dashoffset:100}}
  @keyframes gy{from{transform:scaleY(0)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="pig" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" class="bg"/><rect x="8" y="6" width="15" height="20" rx="1.6" class="pg"/><rect x="8" y="6" width="2.6" height="20" class="sp"/><rect x="12.5" y="10" width="6" height="1.3" rx=".6" class="ln"/><rect x="12.5" y="14" width="6" height="1.3" rx=".6" class="ln"/><rect x="12.5" y="18" width="6" height="1.3" rx=".6" class="ln"/><path d="M14 22.5 24.5 12l2.6 2.6-10.5 10.5-3.4.8z" class="pc"/></svg><h1>カード明細家計簿</h1></div>
    <div class="monthnav" role="group" aria-label="表示する月">
      <button id="prev" type="button" aria-label="前の月">‹</button>
      <div class="m" id="mlabel"></div>
      <button id="next" type="button" aria-label="次の月">›</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">

/* ---------- text helpers ---------- */
const SMALL = {"ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ッ":"ツ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ヮ":"ワ","ヵ":"カ","ヶ":"ケ"};
// 照合用キー: 半角/全角・ひらがな/カタカナ・小書き文字・長音・空白の揺れを吸収
function mkey(s){
  s = String(s||"").normalize("NFKC").toLowerCase();
  s = s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
  s = s.replace(/[ァィゥェォッャュョヮヵヶ]/g, c => SMALL[c]);
  s = s.replace(/[ー－‐\-−–—ｰ]/g, "-");
  return s.replace(/[\s・.,、。*'"（）()]/g, "");
}
function disp(raw){
  let s = String(raw||"").normalize("NFKC").replace(/\s+/g," ").trim();
  s = s.replace(/利用国[A-Z]{3}$/,"").trim();
  s = s.replace(/([ァ-ヺ])-(?=[ァ-ヺ])/g,(m,a)=>"ンッ".includes(a)?m:a+"ー");
  return s;
}
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => (n<0?"−":"") + "¥" + Math.abs(n).toLocaleString("ja-JP");
const short = n => { const a=Math.abs(n); if(a>=10000){const v=a/10000; return (v>=100?Math.round(v):Math.round(v*10)/10)+"万";} return a.toLocaleString("ja-JP"); };
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const ymOf = d => d.slice(0,7);
function shiftYm(ym, k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,"0")}`; }

function classify(name){
  const k = mkey(name); let best = null, len = 0;
  for (const r of S.rules){
    const rk = mkey(r.kw); if (!rk) continue;
    if (rk.length > len && k.includes(rk) && (r.cat===NONE || S.cats.some(c=>c.id===r.cat))){ best = r.cat; len = rk.length; }
  }
  return best || NONE;
}

  const shops = [["まちかどマート","food",600,1800,14],["あおば食堂","food",900,2400,5],["くすのき薬局","daily",700,3800,3],

  const out = {}; let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const base = new Date(); base.setDate(1);
  for (let back=5; back>=0; back--){
    const d = new Date(base.getFullYear(), base.getMonth()-back-1, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const arr = [];
    for (const [n,cat,lo,hi,times] of shops){
      const t = Math.max(1, Math.round(times*(0.7+rnd()*0.6)));
      for (let i=0;i<t;i++){
        const day = String(1+Math.floor(rnd()*days)).padStart(2,"0");
        arr.push({id:"s"+ym+n+i, date:`${ym}-${day}`, name:n, raw:n, amount:Math.round((lo+rnd()*(hi-lo))/10)*10, cat, src:"sample"});
      }
    }
    arr.sort((a,b)=>b.date.localeCompare(a.date)); out[ym]=arr;
  }
  return out;
}

/* ---------- storage ---------- */
const store = { mode:"memory", db:null, uid:null };
const dirty = new Set(); let flushT = null, chain = Promise.resolve();
function markDirty(id){ if (S.sample && id!=="settings") return; dirty.add(id); clearTimeout(flushT); flushT = setTimeout(flush, 350); }
function flush(){
  const ids = [...dirty]; dirty.clear();
  chain = chain.then(async () => {
    for (const id of ids){
      try { await writeDoc(id); }
      catch(e){ toast("保存できませんでした。時間をおいてもう一度操作してください。"); console.warn(e); }
    }
  });
  return chain;
}
function settingsBody(){ return {v:2, cats:S.cats, rules:S.rules}; }
async function writeDoc(id){
  if (store.mode==="db"){
    const ref = store.db.collection("data/users/"+store.uid).doc(id);
    if (id==="settings") return ref.set(settingsBody());
    const ym = id.slice(2), txns = S.months[ym];
    return (txns && txns.length) ? ref.set({ym, txns}) : ref.delete();
  }
  if (store.mode==="local"){
    try { localStorage.setItem("kkb-data", JSON.stringify({settings:settingsBody(), months:S.sample?{}:S.months})); } catch(e){}
  }
}
function applyLoaded(settings, months){
  if (settings && Array.isArray(settings.cats)) { S.cats = settings.cats; S.rules = Array.isArray(settings.rules)?settings.rules:[]; }
  if (months && Object.keys(months).length){ S.months = months; S.sample = false; S.month = latestMonth(); }
  if (settings && Array.isArray(settings.cats) && !(settings.v >= 2)) migrateV2();
}
// 旧バージョンの設定を新しい既定カテゴリに合わせる（1回だけ）
//  ・「外食」→「食費」にまとめる　・「衣服・美容」→「衣服」と「美容」に分ける
function migrateV2(){
  const ch = new Set(["settings"]);
  if (S.cats.some(c => c.id==="eatout")){
    for (const [m,arr] of Object.entries(S.months)) for (const t of arr) if (t.cat==="eatout"){ t.cat = "food"; ch.add("m-"+m); }
    for (const r of S.rules) if (r.cat==="eatout") r.cat = "food";
    S.cats = S.cats.filter(c => c.id!=="eatout");
  }
  const f = S.cats.find(c => c.id==="fashion");
  if (f && f.name==="衣服・美容" && !S.cats.some(c => c.id==="beauty")){
    f.name = "衣服";
    S.cats.splice(S.cats.indexOf(f)+1, 0, {id:"beauty", name:"美容", icon:null});
    const beautyKw = DEFAULT_RULES.filter(r => r.cat==="beauty");
    for (const r of S.rules) if (r.cat==="fashion" && beautyKw.some(b => mkey(b.kw)===mkey(r.kw))) r.cat = "beauty";
    for (const b of beautyKw) if (!S.rules.some(r => mkey(r.kw)===mkey(b.kw))) S.rules.push({...b});
    for (const [m,arr] of Object.entries(S.months)) for (const t of arr) if (t.cat==="fashion" && !t.locked){ const c = classify(t.name); if (c==="beauty"){ t.cat = c; ch.add("m-"+m); } }
  }
  for (const id of ch) markDirty(id);
}
async function initStorage(){
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch(e){}

}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=='\r') f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function readText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) { try { t = new TextDecoder("shift_jis").decode(buf); } catch(e){} }
  return t.replace(/^﻿/,"");
}
function parseRakuten(text){
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => r.some(x=>x.trim()==="利用日"));
  if (hi<0) throw new Error("「利用日」の列が見つかりません。楽天カードの明細CSVを選んでください。");
  const h = rows[hi].map(x=>x.trim());
  const iD = h.indexOf("利用日"), iN = h.findIndex(x=>x.startsWith("利用店名")), iA = h.indexOf("利用金額"), iT = h.indexOf("支払総額");
  if (iN<0 || (iA<0 && iT<0)) throw new Error("「利用店名・商品名」または「利用金額」の列が見つかりません。");
  const out = [];
  for (const r of rows.slice(hi+1)){
    const date = (r[iD]||"").trim(), name = r[iN]||"";
    if (!date){ if (out.length && name.trim()) out[out.length-1].memo = disp(name).replace(/\s+/g," "); continue; }
    const m = date.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if (!m) continue;
    const amt = parseInt(String(r[iA>=0?iA:iT]??"").replace(/[,円\s]/g,""),10); if (isNaN(amt)) continue;
    out.push({date:`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`, raw:name.trim(), amount:amt});
  }
  return out;
}
async function importFiles(files){
  const log = [];
  if (S.sample){ S.months = {}; S.sample = false; }
  const exists = new Set(allTxns().map(t=>t.id));
  const touched = new Set();
  for (const file of files){
    try {
      const recs = parseRakuten(await readText(file));
      const occ = {}; let add=0, dup=0, unc=0; let min=null, max=null;
      for (const r of recs){
        const key = `${r.date}|${r.raw}|${r.amount}`; occ[key]=(occ[key]||0)+1;
        const id = "c" + hash(key+"|"+occ[key]);
        if (exists.has(id)){ dup++; continue; }
        const name = disp(r.raw), cat = classify(name), ym = ymOf(r.date);
        (S.months[ym] ||= []).push({id, date:r.date, name, raw:r.raw, amount:r.amount, cat, src:"csv", ...(r.memo?{memo:r.memo}:{})});
        exists.add(id); touched.add(ym); add++; if (cat===NONE) unc++;
        if (!min || r.date<min) min=r.date; if (!max || r.date>max) max=r.date;
      }
      log.push({file:file.name, add, dup, unc, total:recs.length, min, max});
    } catch(e){ log.push({file:file.name, error:e.message||"読み込めませんでした。"}); }
  }
  for (const ym of touched){ S.months[ym].sort((a,b)=>b.date.localeCompare(a.date)); markDirty("m-"+ym); }
  const added = log.reduce((s,l)=>s+(l.add||0),0);
  if (added){ const lastMax = log.filter(l=>l.max).map(l=>l.max).sort().pop(); S.month = ymOf(lastMax); }
  S.importLog = log; render();
}

/* ---------- mutations ---------- */
function setCat(ym, id, cat){
  const t = (S.months[ym]||[]).find(x=>x.id===id); if (!t) return;
  t.cat = cat; t.locked = true; markDirty("m-"+ym);
  if (S.learn && cat!==NONE){
    const kw = t.name, k = mkey(kw);
    const ex = S.rules.find(r=>mkey(r.kw)===k);
    if (ex) ex.cat = cat; else S.rules.push({kw, cat});
    markDirty("settings");
    let n = 0;
    for (const [m, arr] of Object.entries(S.months)) for (const x of arr){
      if (x!==t && !x.locked && mkey(x.name)===k && x.cat!==cat){ x.cat = cat; n++; markDirty("m-"+m); }
    }
    toast(`「${kw}」を今後「${catName(cat)}」に分類します` + (n?`（ほか${n}件も変更）`:""));
  }
  render();
}
let lastDeleted = null;
function delTxn(ym, id){
  const arr = S.months[ym]||[]; const i = arr.findIndex(x=>x.id===id); if (i<0) return;
  const [t] = arr.splice(i,1); if (!arr.length) delete S.months[ym];
  lastDeleted = {ym, t}; markDirty("m-"+ym); render();
  toast(`「${t.name}」を削除しました`, "元に戻す", () => {
    if (!lastDeleted) return; (S.months[lastDeleted.ym] ||= []).push(lastDeleted.t);
    S.months[lastDeleted.ym].sort((a,b)=>b.date.localeCompare(a.date)); markDirty("m-"+lastDeleted.ym); lastDeleted=null; render();
  });
}
function reapply(){
  let n=0;
  for (const [m, arr] of Object.entries(S.months)) for (const x of arr){
    if (x.locked) continue; const c = classify(x.name); if (c!==x.cat){ x.cat=c; n++; markDirty("m-"+m); }
  }
  toast(n ? `${n}件の明細を分類し直しました` : "変更が必要な明細はありませんでした"); render();
}

/* ---------- toast ---------- */
let toastT = null;
function toast(msg, actLabel, act){
  const host = document.getElementById("toast-host");
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${actLabel?`<button type="button">${esc(actLabel)}</button>`:""}</div>`;
  if (actLabel) host.querySelector("button").onclick = () => { host.innerHTML=""; act(); };
  clearTimeout(toastT); toastT = setTimeout(()=>{ host.innerHTML=""; }, actLabel?6000:3500);
}

/* ---------- aggregates ---------- */
function monthTotal(ym){ return (S.months[ym]||[]).reduce((s,t)=>s+t.amount,0); }
function latestMonth(){ const ks = Object.keys(S.months).sort(); return ks[ks.length-1] || null; }
function niceMax(v){ if (v<=0) return 10000; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p>=v) return m*p; return 10*p; }

const $view = document.getElementById("view");

let nextAnim = "fade", shownTotal = 0, growCat = false;
const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } };
function countUp(el, from, to){
  const fmt = v => Math.round(v).toLocaleString("ja-JP");
  if (reduceMotion() || from===to){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 750;
  const step = now => { const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(from + (to-from)*e); if (p<1 && el.isConnected) requestAnimationFrame(step); };
  el.textContent = fmt(from); requestAnimationFrame(step);
}

function trendChart(id, months, vals, cur, avg){
  const mx = niceMax(Math.max(...vals, avg||0, 1));
  const grid = [0,.5,1].map(f=>`<div class="gl${f===0?" base":""}" style="bottom:calc(22px + ${f} * (100% - 22px))"><span>${f? short(mx*f):"0"}</span></div>`).join("");
  const cols = months.map((m,i)=>`<button type="button" class="col${m===cur?" cur":""}" data-ym="${m}" data-v="${vals[i]}" aria-label="${ymLabel(m)} ${yen(vals[i])}"><div class="b" style="height:${Math.max(0,vals[i])/mx*100}%;--i:${i}"></div><span class="x">${Number(m.slice(5))}月</span></button>`).join("");
  const av = avg ? `<div class="avg" style="bottom:calc(22px + ${avg/mx} * (100% - 22px))"><span>平均 ${short(avg)}</span></div>` : "";
  return `<div class="trend" id="${id}">${grid}${av}<div class="cols">${cols}</div></div>`;
}
function catDonut(cats, total){
  const pos = cats.filter(([,v])=>v>0), sum = pos.reduce((s,[,v])=>s+v,0);
  if (!sum) return "";
  const gap = pos.length>1 ? .5 : 0; let at = 0;
  const sl = pos.map(([c,v])=>{ const p = v/sum*100, len = Math.max(p-gap, .4);
    const el = `<circle class="sl" cx="21" cy="21" r="15.915" pathLength="100" stroke-width="6" stroke="${ICONS[iconKey(c)]?.[0]||ICONS.tag[0]}" stroke-dasharray="${len.toFixed(2)} 100" stroke-dashoffset="${(-at).toFixed(2)}" data-fcat="${esc(c)}"/>`;
    at += p; return el; }).join("");
  return `<div class="donut"><svg viewBox="0 0 42 42" aria-hidden="true">
    <mask id="dmask"><circle class="sweep" cx="21" cy="21" r="15.915" pathLength="100" stroke="#fff" stroke-width="8" stroke-dasharray="100 100"/></mask>
    <circle class="bgr" cx="21" cy="21" r="15.915" stroke-width="6"/><g mask="url(#dmask)">${sl}</g></svg>
    <div class="ctr"><span>支出</span><b class="num">${yen(total)}</b></div></div>`;
}
function catTrend(ym){
  const first = Object.keys(S.months).sort()[0] || ym;
  const months = Array.from({length:12},(_,i)=>shiftYm(ym,i-11)).filter(m => m>=first || m===ym);
  const sums = {};
  for (const m of months) for (const t of (S.months[m]||[])) { (sums[t.cat] ||= {}); sums[t.cat][m] = (sums[t.cat][m]||0) + t.amount; }
  const cats = Object.keys(sums).filter(c => months.some(m => sums[c][m]))
    .sort((a,b) => (sums[b][ym]||0)-(sums[a][ym]||0) || months.reduce((s,m)=>s+(sums[b][m]||0)-(sums[a][m]||0),0));
  if (!cats.length) return "";
  const sel = cats.includes(S.trendCat) ? S.trendCat : cats[0];
  const vals = months.map(m => sums[sel][m]||0);
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/months.length);
  const cur = sums[sel][ym]||0, prevYm = shiftYm(ym,-1), dv = cur - (sums[sel][prevYm]||0);
  const chips = cats.map(c=>`<button type="button" class="${c===NONE?"none":""}" data-tcat="${esc(c)}" aria-pressed="${c===sel}">${catIcon(c,20)}${esc(catName(c))}</button>`).join("");
  return `<section class="panel"><h2>カテゴリ別の推移<small>棒をタップで明細へ</small></h2>
    <div class="chips" id="chips">${chips}</div>
    <div class="ctsum"><span>${Number(ym.slice(5))}月 <b class="num">${yen(cur)}</b></span>
      ${months.includes(prevYm) ? `<span>前月差 <b class="num ${dv>0?"up":dv<0?"down":""}">${dv>0?"▲":dv<0?"▼":"±"}${yen(Math.abs(dv))}</b></span>` : ""}
      <span>${months.length}か月平均 <b class="num">${yen(avg)}</b></span></div>
    ${trendChart("ctrend", months, vals, ym, avg).replace('id="ctrend"', `id="ctrend" data-cat="${esc(sel)}"`)}
  </section>`;
}

function renderOverview(){

  const cats = Object.entries(by).filter(([,v])=>v!==0).sort((a,b)=>b[1]-a[1]);

    </section>`;
  $view.innerHTML = strip + (!txns.length ? `<div class="panel empty">${ymLabel(ym)}の明細はありません。<br><br><button class="btn primary" type="button" data-go="import">CSVを取り込む</button></div>` : `

      <span><b class="num">${txns.length}</b> 件</span>
      ${prev && prevN>=5 ? `<span>前月比 <b class="num delta ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${yen(Math.abs(d))}（${dp>0?"+":""}${dp}%）</b></span>` : ""}

    </div>
    <div class="grid g2">

      <section class="panel"><h2>月別の支出<small>棒をタップで明細へ</small></h2>${trendChart("trend", months, vals, ym, 0)}</section>

      <section class="panel"><h2>よく使ったお店<small>金額順</small></h2><ul class="shops">${shops.map(([n,o])=>`<li><span>${esc(n)}<span class="c">${o.n}回</span></span><span class="num">${yen(o.v)}</span></li>`).join("")}</ul></section>

  const ch = document.getElementById("chips"), on = ch && ch.querySelector('[aria-pressed="true"]');
  if (on) ch.scrollLeft = on.offsetLeft - ch.offsetLeft - 18;
  if (growCat){ const ct = document.getElementById("ctrend"); if (ct && !reduceMotion()) ct.classList.add("grow"); growCat = false; }
  for (const tr of document.querySelectorAll(".trend")) bindTip(tr);
  return;
}
function bindTip(tr){
  {
    tr.addEventListener("pointerover", e => { const c = e.target.closest(".col"); if (!c) return;
      tr.querySelector(".tip")?.remove(); const r = c.getBoundingClientRect(), tb = tr.getBoundingClientRect(), b = c.querySelector(".b").getBoundingClientRect();
      const tip = document.createElement("div"); tip.className="tip"; tip.textContent = `${ymLabel(c.dataset.ym)}　${yen(+c.dataset.v)}`;
      let x = r.left - tb.left + r.width/2; x = Math.min(Math.max(x, 70), tb.width-70);
      tip.style.left = x+"px"; tip.style.top = (b.top - tb.top - 6)+"px"; tr.appendChild(tip); });
    tr.addEventListener("pointerleave", () => tr.querySelector(".tip")?.remove());

}

      <section class="panel"><h2>自動分類ルール<small>${S.rules.length}件</small></h2>
        <p class="note" style="margin:0 0 10px">お店の名前にキーワードが含まれていたら、そのカテゴリに分類します。複数当てはまるときは長いキーワードが優先です。半角・全角やカタカナの表記ゆれは気にしなくて大丈夫です。</p>
        <form class="inline" id="ruleform" style="margin-bottom:10px"><input type="text" id="newkw" placeholder="キーワード（例：スーパー）" required><select id="newrc">${S.cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select><button class="btn primary" type="submit">追加</button></form>
        <input type="search" id="rq" placeholder="ルールを検索" value="${esc(S.rq)}" style="width:100%;margin-bottom:8px">
        <div class="rulebox">${rules.map(({r,i})=>`<div class="rulerow">
          <input type="text" data-rkw="${i}" value="${esc(r.kw)}" aria-label="キーワード">
          <select data-rcat="${i}" aria-label="分類先">${catOptions(r.cat)}</select>
          <button type="button" class="icon-btn" data-rdel="${i}" aria-label="ルールを削除">×</button></div>`).join("") || `<p class="note">該当するルールはありません。</p>`}</div>
        <div class="inline" style="margin-top:12px"><button type="button" class="btn" id="reapply">ルールを明細に再適用</button><span class="note" style="margin:0">手動で選んだカテゴリはそのままです</span></div>
      </section>
      <section class="panel"><h2>データの初期化</h2>
        <p class="note" style="margin:0 0 10px">取り込んだ明細をすべて削除し、カテゴリとルールも最初の状態に戻します。</p>
        <button type="button" class="btn danger${S.armed==="__reset"?" armed":""}" id="reset">${S.armed==="__reset"?"本当にすべて削除する":"すべてのデータを削除"}</button>
      </section>
    </div>`;
}

/* ---------- events ---------- */
function goTab(tab){
  if (!tab || tab===S.tab) return;
  nextAnim = "tab"; window.scrollTo(0,0);
  S.tab = tab; S.armed = null; try { localStorage.setItem("kkb-tab", S.tab); } catch(e){} render();
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (b) goTab(b.dataset.tab);
});
// 画面を左右にスワイプして月を切り替える（概要・明細のみ）
// ・横方向がはっきりしたときだけ反応（縦スクロール中は動かない）
// ・指に少しだけついてくる控えめな動き（薄くはならない）
(() => {
  let sx=0, sy=0, st=0, state="idle", dx=0;   // state: idle / wait / drag / scroll
  const monthTab = () => S.tab==="overview" || S.tab==="list";
  const setX = (x, ms) => {
    $view.style.transition = ms ? `transform ${ms}ms cubic-bezier(.25,.8,.25,1)` : "none";
    $view.style.transform = x ? `translateX(${x}px)` : "";
  };
  const damp = d => Math.sign(d) * Math.min(Math.abs(d)*0.35, 56);   // 最大56pxまで
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    const ok = e.touches.length===1 && monthTab() && !e.target.closest("input,select,textarea,.chips,.tabs,.toast,.top")
               && t.clientX > 24 && t.clientX < innerWidth-24;   // 画面の端はOSの操作に任せる
    state = ok ? "wait" : "idle"; sx=t.clientX; sy=t.clientY; st=Date.now(); dx=0;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (state==="idle" || state==="scroll") return;
    const t = e.touches[0]; dx = t.clientX-sx; const dy = t.clientY-sy;
    if (state==="wait"){
      if (Math.abs(dy) > 8 && Math.abs(dy) >= Math.abs(dx)*0.6) { state="scroll"; return; }   // 縦の動きが少しでも勝ったら縦スクロール扱い
      if (Math.abs(dx) < 18 || Math.abs(dx) < Math.abs(dy)*2.2) return;                         // 横がはっきりするまで待つ
      state = "drag"; document.querySelectorAll(".tip").forEach(x=>x.remove());
    }
    if (e.cancelable) e.preventDefault();       // 横スワイプ中は縦にスクロールさせない
    if (!reduceMotion()) setX(damp(dx), 0);
  }, {passive:false});
  const finish = cancel => {
    const was = state; state = "idle";
    if (was!=="drag") return;
    const quick = Math.abs(dx)/(Date.now()-st) > 0.5 && Math.abs(dx) > 40;
    if (cancel || (Math.abs(dx) < 80 && !quick)){ setX(0, 180); setTimeout(()=>setX(0,0), 190); return; }   // 元に戻す
    const dir = dx < 0 ? 1 : -1;
    S.month = shiftYm(S.month, dir); nextAnim = "month"; render();
    if (reduceMotion()){ setX(0,0); return; }
    setX(dir*28, 0);                                             // 新しい月を進む向きから少しだけ
    requestAnimationFrame(() => requestAnimationFrame(() => { setX(0, 220); setTimeout(()=>setX(0,0), 230); }));
  };
  document.addEventListener("touchend", () => finish(false), {passive:true});
  document.addEventListener("touchcancel", () => finish(true), {passive:true});
})();
document.getElementById("prev").onclick = () => { S.month = shiftYm(S.month,-1); nextAnim = "right"; render(); flipMonth(); };
document.getElementById("next").onclick = () => { S.month = shiftYm(S.month,1); nextAnim = "left"; render(); flipMonth(); };

document.addEventListener("click", async e => {
  const t = e.target;
  const go = t.closest("[data-go]"); if (go){ nextAnim="left"; window.scrollTo(0,0); S.tab = go.dataset.go; render(); return; }
  const fc = t.closest("[data-fcat]"); if (fc){ S.fCat = fc.dataset.fcat; S.q=""; S.tab="list"; nextAnim="left"; window.scrollTo(0,0); render(); return; }
  const tc = t.closest("[data-tcat]"); if (tc){ S.trendCat = tc.dataset.tcat; growCat = true; render(); return; }
  const mn = t.closest("[data-mnav]"); if (mn){ S.month = shiftYm(S.month, +mn.dataset.mnav); nextAnim="month"; render(); return; }
  const col = t.closest(".col[data-ym]");
  if (col){ const tr = col.closest(".trend"); S.month = col.dataset.ym; S.fCat = (tr && tr.dataset.cat) || "all"; S.q="";
    S.tab = "list"; nextAnim = "tab"; window.scrollTo(0,0); render(); return; }
  const del = t.closest("[data-del]"); if (del){ delTxn(S.month, del.dataset.del); return; }
  const cd = t.closest("[data-cdel]");
  if (cd){ const id = cd.dataset.cdel;
    if (S.armed!==id){ S.armed=id; render(); return; }
    S.armed=null; S.cats = S.cats.filter(c=>c.id!==id); S.rules = S.rules.filter(r=>r.cat!==id);
    for (const [m,arr] of Object.entries(S.months)) for (const x of arr) if (x.cat===id){ x.cat=NONE; x.locked=false; markDirty("m-"+m); }
    if (S.fCat===id) S.fCat="all"; markDirty("settings"); render(); return; }
  const ip = t.closest("[data-ipick]"); if (ip){ S.iconPick = S.iconPick===ip.dataset.ipick ? null : ip.dataset.ipick; render(); return; }
  const is = t.closest("[data-iset]"); if (is){ const c = S.cats.find(x=>x.id===S.iconPick); if (c){ c.icon = is.dataset.iset; markDirty("settings"); } S.iconPick = null; render(); return; }
  const rd = t.closest("[data-rdel]"); if (rd){ S.rules.splice(+rd.dataset.rdel,1); markDirty("settings"); render(); return; }
  if (t.id==="reapply"){ reapply(); return; }
  if (t.id==="reset"){
    if (S.armed!=="__reset"){ S.armed="__reset"; render(); return; }
    S.armed=null; for (const ym of Object.keys(S.months)) { delete S.months[ym]; markDirty("m-"+ym); }
    S.cats = DEFAULT_CATS.map(c=>({...c})); S.rules = DEFAULT_RULES.map(r=>({...r})); markDirty("settings");
    S.months = makeSample(); S.sample = true; S.month = latestMonth(); S.importLog=null; toast("すべてのデータを削除しました"); render(); return; }
  if (t.id==="export"){
    const data = JSON.stringify({app:"kakeibo", v:1, exportedAt:new Date().toISOString(), cats:S.cats, rules:S.rules, months:S.sample?{}:S.months}, null, 1);
    const name = `kakeibo-backup-${new Date().toISOString().slice(0,10)}.json`;
    let dl = null; try { dl = await window.claude?.use?.("downloads"); } catch(err){}
    if (dl){ try { await dl.save({filename:name, data}); toast("バックアップを保存しました"); } catch(err){ if (err?.code!=="declined") toast("保存できませんでした。もう一度お試しください。"); } }
    else if (!window.claude) {
      const file = new File([data], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        try { await navigator.share({files:[file], title:name}); toast("バックアップを書き出しました"); }
        catch(err){ if (err && err.name!=="AbortError") toast("書き出せませんでした。もう一度お試しください。"); }
        return;
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); toast("バックアップを保存しました"); }
    else { document.getElementById("exportbox").innerHTML = `<p class="note">この表示ではファイル保存ができないため、下の内容をコピーして保存してください。</p><textarea readonly style="width:100%;height:120px;font-family:var(--mono);font-size:11px">${esc(data)}</textarea>`; }
    return; }
  if (t.id==="restore-no"){ S.pendingImport=null; render(); return; }
  if (t.id==="restore-ok"){
    const o = S.pendingImport.data; S.pendingImport=null;
    for (const ym of Object.keys(S.months)) markDirty("m-"+ym);
    S.cats = o.cats; S.rules = o.rules||[]; S.months = o.months||{}; S.sample = !Object.keys(S.months).length;
    if (S.sample) S.months = makeSample();
    for (const ym of Object.keys(S.months)) markDirty("m-"+ym);
    markDirty("settings"); S.month = latestMonth(); toast("バックアップから復元しました"); render(); return; }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.classList.contains("csel")){ setCat(S.month, t.dataset.id, t.value); return; }
  if (t.id==="fcat"){ S.fCat = t.value; render(); return; }
  if (t.id==="learn"){ S.learn = t.checked; return; }
  if (t.dataset.cname){ const c = S.cats.find(x=>x.id===t.dataset.cname); const v=t.value.trim(); if (c && v){ c.name=v; markDirty("settings"); } else render(); return; }
  if (t.dataset.rkw!==undefined){ const v=t.value.trim(); if (v){ S.rules[+t.dataset.rkw].kw=v; markDirty("settings"); } else render(); return; }
  if (t.dataset.rcat!==undefined){ S.rules[+t.dataset.rcat].cat=t.value; markDirty("settings"); return; }
  if (t.id==="restore"){
    const f = t.files[0]; t.value=""; if (!f) return;
    try { const o = JSON.parse(await readText(f)); if (o.app!=="kakeibo" || !Array.isArray(o.cats)) throw 0;
      S.pendingImport = {name:f.name, data:o, count:Object.values(o.months||{}).flat().length}; render(); }
    catch(err){ toast("この家計簿のバックアップファイルではありません"); }
  }
});
let qT=null;
document.addEventListener("input", e => {
  if (e.target.id==="q"){ S.q = e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const el=document.getElementById("q"); el.focus(); try{el.setSelectionRange(pos,pos);}catch(_){} },200); }
  if (e.target.id==="rq"){ S.rq = e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ render(); const el=document.getElementById("rq"); el.focus(); },200); }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id==="addform"){
    const date = document.getElementById("add-date").value, name = document.getElementById("add-name").value.trim(), amount = parseInt(document.getElementById("add-amt").value,10);
    let cat = document.getElementById("add-cat").value; if (!date || !name || isNaN(amount)) return;
    if (S.sample){ S.months = {}; S.sample = false; }
    const locked = cat!=="auto"; if (!locked) cat = classify(name);
    const ym = ymOf(date); (S.months[ym] ||= []).push({id:uid(), date, name, raw:name, amount, cat, src:"manual", locked});
    S.months[ym].sort((a,b)=>b.date.localeCompare(a.date)); markDirty("m-"+ym); S.month = ym;
    toast(`「${name}」${yen(amount)} を追加しました（${catName(cat)}）`); render();
    document.querySelector("details.add").open = true; document.getElementById("add-name").focus(); return;
  }
  if (f.id==="catform"){ const v = document.getElementById("newcat").value.trim(); if (!v) return;
    S.cats.push({id:"c"+Date.now().toString(36), name:v, icon:"tag"}); markDirty("settings"); render(); return; }
  if (f.id==="ruleform"){ const kw = document.getElementById("newkw").value.trim(), cat = document.getElementById("newrc").value; if (!kw) return;
    const ex = S.rules.find(r=>mkey(r.kw)===mkey(kw)); if (ex) ex.cat=cat; else S.rules.push({kw,cat});
    markDirty("settings"); S.rq=""; render(); toast(`ルール「${kw} → ${catName(cat)}」を追加しました。「再適用」で既存の明細にも反映できます`); return; }
});

/* ---------- boot ---------- */
S.months = makeSample(); S.month = latestMonth();
render();
initStorage();
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
