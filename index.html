<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カード明細家計簿</title>
<meta name="theme-color" content="#1c6a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f1f3f0; --surface:#ffffff; --surface-2:#ecefeb; --ink:#17201b; --ink-2:#4a5550; --muted:#78837d;
  --line:#dbe1dc; --accent:#1c6a55; --accent-hover:#155443; --accent-soft:#d9ece5; --accent-ink:#ffffff;
  --bar:#2d7a65; --bar-dim:#86b8a6; --grid:#e4e8e4;
  --warn:#9a5208; --warn-soft:#fbeedc; --danger:#b3261e; --danger-soft:#f9e1de; --danger-dim:#e39a92; --good:#1d6f36;
  --shadow:0 1px 2px rgba(20,32,27,.04),0 6px 20px rgba(20,32,27,.06);
  --hair:rgba(20,32,27,.1); --radius:18px; --radius-sm:12px;
  --tabbar:color-mix(in srgb, var(--surface) 78%, transparent); --scrim:rgba(10,16,13,.42); --budget:#c26a00; --toast-gray:#66716b;
  --pig:#e98ea6; --pig-ink:#6b2438;
  --sans:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","Roboto Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d110f; --surface:#171d1a; --surface-2:#212925; --ink:#e6ebe8; --ink-2:#b2bcb6; --muted:#84908a;
    --line:#29312d; --accent:#5ec2a2; --accent-hover:#7ad1b5; --accent-soft:#1b3830; --accent-ink:#0b1813;
    --bar:#4fb192; --bar-dim:#3f6f5f; --grid:#232b27;
    --warn:#f0a750; --warn-soft:#382916; --danger:#f07167; --danger-soft:#3a1d1a; --danger-dim:#7a3833; --good:#6fd08c;
    --shadow:0 1px 2px rgba(0,0,0,.35); --hair:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.6); --budget:#f0a750; --toast-gray:#48524d; --pig:#f0a3b8; --pig-ink:#4a1626;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d110f; --surface:#171d1a; --surface-2:#212925; --ink:#e6ebe8; --ink-2:#b2bcb6; --muted:#84908a;
  --line:#29312d; --accent:#5ec2a2; --accent-hover:#7ad1b5; --accent-soft:#1b3830; --accent-ink:#0b1813;
  --bar:#4fb192; --bar-dim:#3f6f5f; --grid:#232b27;
  --warn:#f0a750; --warn-soft:#382916; --danger:#f07167; --danger-soft:#3a1d1a; --danger-dim:#7a3833; --good:#6fd08c;
  --shadow:0 1px 2px rgba(0,0,0,.35); --hair:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.6); --budget:#f0a750; --toast-gray:#48524d; --pig:#f0a3b8; --pig-ink:#4a1626;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px));padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:12px;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:3px}
.monthnav button{border:0;background:transparent;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px;color:var(--ink-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .m{min-width:112px;text-align:center;font-weight:700;font-size:15px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom, 0px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabs{background:var(--surface)}}
.tabs button{border:0;background:transparent;padding:7px 2px 8px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button svg{box-sizing:content-box;width:22px;height:22px;padding:3px 16px;border-radius:999px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabs button[aria-selected="true"] svg{background:var(--accent-soft)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 10px);margin:0!important}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;line-height:18px;text-align:center}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px}
.banner.warn{background:var(--warn-soft)}

.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}

/* summary */
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 32px;padding:4px 2px 20px}
.mstrip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 8px;margin-bottom:14px}
.mstrip .side{border:0;background:transparent;display:flex;flex-direction:column;gap:1px;padding:8px 6px;border-radius:10px;cursor:pointer;color:var(--ink-2);min-width:0}
.mstrip .side:active{background:var(--surface-2)}
.mstrip .prev{align-items:flex-start;text-align:left}
.mstrip .next{align-items:flex-end;text-align:right}
.mstrip .side .ml{font-size:12px;white-space:nowrap}
.mstrip .side .mv{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mstrip .side .mv.none{color:var(--muted);font-family:var(--sans);font-size:12px}
.mstrip .center{text-align:center;min-width:0}
.mstrip .center .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.mstrip .center .val{font-family:var(--mono);font-size:clamp(24px,8vw,34px);font-weight:600;line-height:1.15;letter-spacing:-.02em;white-space:nowrap}
.mstrip .center .val .yen{font-size:.55em;margin-right:2px;color:var(--ink-2)}
.meta.solo{justify-content:center;padding:0 2px 18px}
.total .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.total .val{font-family:var(--mono);font-size:clamp(32px,7vw,44px);font-weight:600;line-height:1.1;letter-spacing:-.02em}
.total .val .yen{font-size:.55em;margin-right:2px;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--ink-2);padding-bottom:4px}
.meta b{font-weight:600;color:var(--ink)}
.delta.up{color:var(--danger)} .delta.down{color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;cursor:pointer;background:var(--warn-soft);color:var(--warn)}
.chip:hover{filter:brightness(.97)}

/* 月｜年の切り替え */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;width:min(100%,220px);margin:0 auto 12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 0;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* category bars */
.donut{position:relative;width:min(52vw,190px);aspect-ratio:1;margin:2px auto 12px}
.donut svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none}
.donut .bgr{stroke:var(--grid)}
.donut .sl{cursor:pointer}
.donut .sl:hover{filter:brightness(.92)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut .ctr span{font-size:12px;color:var(--muted)}
.donut .ctr b{font-size:clamp(17px,5.4vw,21px);font-weight:700;color:var(--ink)}
.cbars{display:flex;flex-direction:column;gap:2px}
/* 予算 */
.budget{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.budget .bl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.budget .bl b{color:var(--ink);font-weight:600}
.budget.over .bl span:last-child,.budget.over .bl span:last-child b{color:var(--danger)}
.bbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.over .bbar i{background:var(--danger)}
.cbar.hasb{grid-template-columns:minmax(0,7.8em) minmax(0,1fr) auto;gap:8px}
.cbar .bbar{height:6px}
.cbar .v{line-height:1.3}
.cbar .v small.bs{display:block;font-size:11px;color:var(--muted);line-height:1.25}
.cbar.over .v small.bs{color:var(--danger)}
.catmore{display:block;width:100%;margin-top:4px;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13px;padding:8px;border-radius:10px;cursor:pointer}
.catmore:hover{background:var(--surface-2)}
.backbtn{display:inline-flex;align-items:center;gap:2px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;min-height:34px;padding:4px 14px 4px 10px;border-radius:999px;margin-left:auto;cursor:pointer}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,12em);gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow input{width:100%;text-align:right}
.cbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 6px;border-radius:7px;border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.cbar:hover{background:var(--surface-2)}
.cbar .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .v{font-size:13px;text-align:right;white-space:nowrap}
.cbar .v span{color:var(--muted);font-size:11px;margin-left:6px;display:inline-block;min-width:3.2em}

/* trend */
.trend{position:relative;height:190px;margin-top:4px;padding-left:42px}
.trend .gl{position:absolute;left:42px;right:0;border-top:1px solid var(--grid)}
.trend .gl.base{border-top-color:var(--line)}
.trend .gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.cols{position:absolute;left:42px;right:0;top:0;bottom:22px;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default;border:0;background:transparent;padding:0}
.col .b{width:min(70%,28px);background:var(--bar-dim);border-radius:4px 4px 0 0;min-height:0}
.col.cur .b{background:var(--bar)}
.col:hover .b{filter:brightness(.92)}
.col .x{position:absolute;bottom:-20px;font-size:10px;color:var(--muted);white-space:nowrap}
.col.cur .x{color:var(--ink);font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;white-space:pre;text-align:center;line-height:1.45;transform:translate(-50%,-100%);z-index:3}

.shops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shops li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.shops li:first-child{border-top:0}
.shops .c{color:var(--muted);font-size:11px;margin-left:6px}

/* list */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 180px}
input[type=text],input[type=search],input[type=number],input[type=date],select{background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:8px 12px;min-height:40px;max-width:100%}
input:focus,select:focus{border-color:var(--accent);outline:0;background:var(--surface)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 16px;min-height:40px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:4px 12px;min-height:32px;font-size:12px;border-radius:9px}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}

.rows{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 14px}
.rows>.row:last-child{border-bottom:0}
.row{display:grid;grid-template-columns:5.2em minmax(0,1fr) 10em 7.5em 32px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .d{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.row .nm{min-width:0}
.row .nm .t{overflow-wrap:anywhere}
.row .nm .memo{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.row .tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.row .a{text-align:right;font-size:14px}
.row .a.neg{color:var(--good)}
.cpick{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;border:1px solid transparent;border-radius:10px;background:var(--surface-2);font-size:14px;cursor:pointer;text-align:left}
.cpick .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpick::after{content:"▾";color:var(--muted);font-size:12px}
.cpick.unset{border-color:var(--warn);color:var(--warn);font-weight:700}
.row.head{font-size:11px;color:var(--muted);padding-block:4px;border-bottom:1px solid var(--line)}
.listfoot{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 10px;font-size:13px;color:var(--ink-2)}
@media all{
  .row{grid-template-columns:minmax(0,1fr) auto 30px;grid-template-areas:"nm a x" "d c c";row-gap:6px}
  .row .nm{grid-area:nm}.row .a{grid-area:a}.row .icon-btn{grid-area:x}
  .row .d{grid-area:d}.row .cat{grid-area:c}
  .row.head{display:none}
}

.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.addform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.addform input,.addform select{width:100%}
details.add{margin-bottom:14px}
details.add summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);padding:4px 0;list-style:none}
details.add summary::before{content:"＋ "}
details.add[open] summary::before{content:"－ "}
details.add .addform{padding:14px;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--radius);margin-top:8px}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0 14px;color:var(--ink-2)}
.drop .big{font-size:16px;font-weight:700;color:var(--ink);margin:0}
.steps{margin:0;padding-left:1.4em;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.result{display:flex;flex-direction:column;gap:6px}
.result .file{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.result .file:first-child{border-top:0}
.result .err{color:var(--danger)}
.stat{display:inline-flex;gap:4px;align-items:baseline}
.stat b{font-family:var(--mono)}

/* settings */
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:auto minmax(0,1fr) 4em auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow input{width:100%}
.setrow .cnt{font-size:12px;color:var(--muted);text-align:right}
.rulerow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9.5em) 30px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.rulerow:first-child{border-top:0}
.rulerow input,.rulerow select{width:100%;min-height:36px;padding:4px 10px}
.rulebox{max-height:420px;overflow-y:auto;padding-right:4px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input[type=text]{flex:1 1 140px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--danger-soft);border-radius:var(--radius-sm);margin-top:10px;font-size:13px}
.store{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}

.ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:30;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.ptr.ready{color:var(--accent)}
.aitext{display:block;width:100%;height:280px;margin-top:10px;padding:10px 12px;border:0;border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:var(--mono);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:10;width:max-content;max-width:calc(100% - 32px)}
.toast span{min-width:0}
.toast.light{background:var(--toast-gray);color:#fff}   /* 「最新のバージョンです」：白だと周りのカードと見分けにくいのでグレー（利用者の希望） */
.toast button{flex:none;white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .2s ease-out}@keyframes rise{from{transform:translate(-50%,8px);opacity:0}}}

/* piggy mark */
.brand{align-items:center}
.pig{width:30px;height:30px;flex:none}
.pig .bg{fill:#e8783a}.pig .pg{fill:#faf6ec}.pig .sp{fill:#e2d6be}.pig .ln{fill:#aaa091}.pig .pc{fill:#ffcd40}

/* category icons */
.ci{display:inline-grid;place-items:center;flex:none;width:var(--s,24px);height:var(--s,24px);border-radius:50%;background:var(--c,#6f7b75)}
.ci svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.cbar .n{display:flex;align-items:center;gap:8px;min-width:0}
.cbar .n b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.row .cat{display:flex;align-items:center;gap:8px;min-width:0}
.row .cat .cpick{flex:1}
/* カテゴリを選ぶシート（動きは付けない） */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.18);max-height:80vh;overflow-y:auto;overscroll-behavior:contain;padding:18px max(16px, env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .sh-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px}
.sheet .sh-h b{font-size:15px;min-width:0;overflow-wrap:anywhere}
.sheet .sh-h span{font-size:12px;color:var(--muted);white-space:nowrap}
.sheet .sh-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet .sh-g button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:68px;min-width:0;padding:6px 4px;border:2px solid transparent;border-radius:14px;background:var(--surface-2);font-size:13px;cursor:pointer}
.sheet .sh-g button .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sh-g button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sheet .sh-g button.none{color:var(--warn)}
.sheet .sh-x{width:100%;margin-top:14px}
/* 月・年のプルダウン（表示の上に透明なselectを重ねる） */
.mpick{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;border:0;padding:0;-webkit-appearance:none;appearance:none}
.mstrip .center{position:relative}
.monthnav .m{position:relative}
.dd{font-size:.8em;color:var(--muted);margin-left:3px}
.iconbtn{border:0;background:transparent;padding:2px;border-radius:50%;cursor:pointer}
.iconbtn .ci{--s:34px}
.picker{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;padding:12px;background:var(--surface-2);border-radius:14px;margin-top:4px}
.picker button{border:2px solid transparent;background:transparent;border-radius:50%;padding:3px;cursor:pointer;justify-self:center}
.picker button[aria-pressed="true"]{border-color:var(--ink)}
.picker .ci{--s:34px}

/* category trend */
.chips{display:flex;gap:6px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chips button.none[aria-pressed="false"]{color:var(--warn)}
.ctsum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2);margin:2px 0 16px}
.ctsum b{color:var(--ink);font-weight:600}
.ctsum .up{color:var(--danger)} .ctsum .down{color:var(--good)}
.bline{position:absolute;left:42px;right:0;top:0;bottom:22px;width:calc(100% - 42px);height:calc(100% - 22px);overflow:visible;pointer-events:none;z-index:2}
.col .bdot{position:absolute;left:50%;width:5px;height:5px;margin:0 0 -2.5px -2.5px;border-radius:50%;background:var(--budget);opacity:.55;pointer-events:none;z-index:2}   /* 点は線に合わせて小さく薄く */
.bline polyline{fill:none;stroke:var(--budget);stroke-width:1;opacity:.45;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.col.over .b{background:var(--danger-dim)}
.col.over.cur .b{background:var(--danger)}
.tlegend{display:flex;justify-content:flex-end;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.tlegend .lb::before{content:"";display:inline-block;width:16px;height:5px;vertical-align:middle;margin-right:5px;opacity:.6;background:radial-gradient(circle,var(--budget) 0 2px,transparent 2.5px) center/5px 5px no-repeat,linear-gradient(var(--budget),var(--budget)) center/100% 1px no-repeat}   /* 予算の線は細く薄く・小さな点つき（利用者の希望） */
.tlegend .la::before{content:"";display:inline-block;width:14px;border-top:1.5px dashed var(--ink-2);vertical-align:middle;margin-right:5px;opacity:.7}
.trend .avg{position:absolute;left:42px;right:0;border-top:1.5px dashed var(--ink-2);z-index:2;pointer-events:none;opacity:.7}
.trend .avg span{position:absolute;right:0;top:-18px;font-size:10px;color:var(--ink-2);background:var(--surface);padding:0 4px;border-radius:3px;font-family:var(--mono)}

/* motion */
#view{touch-action:pan-y}
@media (prefers-reduced-motion:no-preference){
  #view.grow .donut .sweep{animation:sweep .8s cubic-bezier(.3,.7,.2,1) .08s both}
  #view.grow .col .b, .trend.grow .col .b{animation:gy .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom;animation-delay:calc(var(--i,0) * 35ms + 120ms)}
  @keyframes sweep{from{stroke-dashoffset:100}}
  @keyframes gy{from{transform:scaleY(0)}}
}

(() => {

/* ---------- defaults ---------- */

const DEFAULT_CATS = [

/* ---------- category icons ---------- */
const ICONS = {

  utensils:["#e06c5a","M7 3v8 M5 3v4a2 2 0 0 0 4 0V3 M7 11v10 M17 3c-2 0-3 2-3 5s1 4 3 4v9"],

  plane:["#2d8fd5","M3 12l18-8-7 17-2.5-6.5z M11.5 14.5L21 4"],

  game:["#4a6fd1","M6 8h12a4 4 0 0 1 4 4v1a3 3 0 0 1-5.2 2L15 13H9l-1.8 2A3 3 0 0 1 2 13v-1a4 4 0 0 1 4-4z M7 10v4 M5 12h4 M15.5 11h.01 M17.5 13h.01"],

  film:["#4d5561","M4 5h16v14H4z M4 9.5h16 M4 14.5h16 M8 5v4.5 M16 5v4.5 M8 14.5V19 M16 14.5V19"],

const PICKABLE = Object.keys(ICONS).filter(k => k!=="question");
const DEFAULT_ICON = {food:"rice",eatout:"utensils",beauty:"scissors",daily:"bag",transport:"train",housing:"house",utility:"bolt",telecom:"phone",
  subsc:"repeat",hobby:"game",medical:"cross",fashion:"shirt",social:"gift",edu:"book",other:"dots"};
const iconKey = id => id===NONE ? "question" : ((S.cats.find(c=>c.id===id)||{}).icon || DEFAULT_ICON[id] || "tag");
function iconSvg(key, size){
  const [c, d] = ICONS[key] || ICONS.tag;
  return `<span class="ci" style="--c:${c}${size?`;--s:${size}px`:""}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${d}"/></svg></span>`;
}
const catIcon = (id, size) => iconSvg(iconKey(id), size);

/* ---------- text helpers ---------- */
const SMALL = {"ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ッ":"ツ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ヮ":"ワ","ヵ":"カ","ヶ":"ケ"};
// 照合用キー: 半角/全角・ひらがな/カタカナ・小書き文字・長音・空白の揺れを吸収
function mkey(s){
  s = String(s||"").normalize("NFKC").toLowerCase();
  s = s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
  s = s.replace(/[ァィゥェォッャュョヮヵヶ]/g, c => SMALL[c]);
  s = s.replace(/[ー－‐\-−–—ｰ]/g, "-");
  return s.replace(/[\s・.,、。*'"（）()]/g, "");
}
function disp(raw){
  let s = String(raw||"").normalize("NFKC").replace(/\s+/g," ").trim();
  s = s.replace(/利用国[A-Z]{3}$/,"").trim();
  s = s.replace(/([ァ-ヺ])-(?=[ァ-ヺ])/g,(m,a)=>"ンッ".includes(a)?m:a+"ー");
  return s;
}
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => (n<0?"−":"") + "¥" + Math.abs(n).toLocaleString("ja-JP");
const short = n => { const a=Math.abs(n); if(a>=10000){const v=a/10000; return (v>=100?Math.round(v):Math.round(v*10)/10)+"万";} return a.toLocaleString("ja-JP"); };
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const ymOf = d => d.slice(0,7);
function shiftYm(ym, k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,"0")}`; }
const ymLabel = ym => { const [y,m]=ym.split("-"); return `${y}年${Number(m)}月`; };
const uid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const S = {
  cats: DEFAULT_CATS.map(c=>({...c})), rules: DEFAULT_RULES.map(r=>({...r})),

};

const catName = id => id===NONE ? "未分類" : (S.cats.find(c=>c.id===id)?.name ?? "未分類");
const allTxns = () => Object.values(S.months).flat();

function classify(name){
  const k = mkey(name); let best = null, len = 0;
  for (const r of S.rules){
    const rk = mkey(r.kw); if (!rk) continue;
    if (rk.length > len && k.includes(rk) && (r.cat===NONE || S.cats.some(c=>c.id===r.cat))){ best = r.cat; len = rk.length; }
  }
  return best || NONE;
}

/* ---------- sample data (fictional) ---------- */
function makeSample(){
  const shops = [["まちかどマート","food",600,1800,14],["あおば食堂","food",900,2400,5],["くすのき薬局","daily",700,3800,3],
    ["みなと電鉄","transport",420,1600,8],["ひかり電力","utility",6200,8400,1],["つばめ通信","telecom",4600,4600,1],

  const out = {}; let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const base = new Date(); base.setDate(1);
  for (let back=5; back>=0; back--){
    const d = new Date(base.getFullYear(), base.getMonth()-back-1, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

    const arr = [];
    for (const [n,cat,lo,hi,times] of shops){
      const t = Math.max(1, Math.round(times*(0.7+rnd()*0.6)));
      for (let i=0;i<t;i++){
        const day = String(1+Math.floor(rnd()*days)).padStart(2,"0");
        arr.push({id:"s"+ym+n+i, date:`${ym}-${day}`, name:n, raw:n, amount:Math.round((lo+rnd()*(hi-lo))/10)*10, cat, src:"sample"});
      }
    }
    arr.sort((a,b)=>b.date.localeCompare(a.date)); out[ym]=arr;
  }
  return out;
}

function migrateV2(){
  const ch = new Set(["settings"]);
  if (S.cats.some(c => c.id==="eatout")){
    for (const [m,arr] of Object.entries(S.months)) for (const t of arr) if (t.cat==="eatout"){ t.cat = "food"; ch.add("m-"+m); }
    for (const r of S.rules) if (r.cat==="eatout") r.cat = "food";
    S.cats = S.cats.filter(c => c.id!=="eatout");
  }
  const f = S.cats.find(c => c.id==="fashion");
  if (f && f.name==="衣服・美容" && !S.cats.some(c => c.id==="beauty")){
    f.name = "衣服";

    const beautyKw = DEFAULT_RULES.filter(r => r.cat==="beauty");
    for (const r of S.rules) if (r.cat==="fashion" && beautyKw.some(b => mkey(b.kw)===mkey(r.kw))) r.cat = "beauty";
    for (const b of beautyKw) if (!S.rules.some(r => mkey(r.kw)===mkey(b.kw))) S.rules.push({...b});

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=='\r') f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function readText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) { try { t = new TextDecoder("shift_jis").decode(buf); } catch(e){} }
  return t.replace(/^﻿/,"");
}
function parseRakuten(text){
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => r.some(x=>x.trim()==="利用日"));
  if (hi<0) throw new Error("「利用日」の列が見つかりません。楽天カードの明細CSVを選んでください。");
  const h = rows[hi].map(x=>x.trim());
  const iD = h.indexOf("利用日"), iN = h.findIndex(x=>x.startsWith("利用店名")), iA = h.indexOf("利用金額"), iT = h.indexOf("支払総額");
  if (iN<0 || (iA<0 && iT<0)) throw new Error("「利用店名・商品名」または「利用金額」の列が見つかりません。");
  const out = [];
  for (const r of rows.slice(hi+1)){
    const date = (r[iD]||"").trim(), name = r[iN]||"";
    if (!date){ if (out.length && name.trim()) out[out.length-1].memo = disp(name).replace(/\s+/g," "); continue; }
    const m = date.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if (!m) continue;
    const amt = parseInt(String(r[iA>=0?iA:iT]??"").replace(/[,円\s]/g,""),10); if (isNaN(amt)) continue;
    out.push({date:`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`, raw:name.trim(), amount:amt});
  }
  return out;
}
async function importFiles(files){
  const log = [];
  if (S.sample){ S.months = {}; S.sample = false; }
  const exists = new Set(allTxns().map(t=>t.id));
  const touched = new Set();
  for (const file of files){
    try {
      const recs = parseRakuten(await readText(file));
      const occ = {}; let add=0, dup=0, unc=0; let min=null, max=null;
      for (const r of recs){
        const key = `${r.date}|${r.raw}|${r.amount}`; occ[key]=(occ[key]||0)+1;
        const id = "c" + hash(key+"|"+occ[key]);
        if (exists.has(id)){ dup++; continue; }
        const name = disp(r.raw), cat = classify(name), ym = ymOf(r.date);
        (S.months[ym] ||= []).push({id, date:r.date, name, raw:r.raw, amount:r.amount, cat, src:"csv", ...(r.memo?{memo:r.memo}:{})});
        exists.add(id); touched.add(ym); add++; if (cat===NONE) unc++;
        if (!min || r.date<min) min=r.date; if (!max || r.date>max) max=r.date;
      }
      log.push({file:file.name, add, dup, unc, total:recs.length, min, max});
    } catch(e){ log.push({file:file.name, error:e.message||"読み込めませんでした。"}); }
  }
  for (const ym of touched){ S.months[ym].sort((a,b)=>b.date.localeCompare(a.date)); markDirty("m-"+ym); }
  const added = log.reduce((s,l)=>s+(l.add||0),0);
  if (added){ const lastMax = log.filter(l=>l.max).map(l=>l.max).sort().pop(); S.month = ymOf(lastMax); }
  S.importLog = log; render();
}

function countUp(el, from, to){

// budgets：月ごとの予算（無い月は null、0も予算あり）。予算が1円以上の月を結ぶ折れ線（.bline。予算のない月で切れる）と小さな点（.bdot）を描き、超えた月の棒を赤くする
function trendChart(id, months, vals, cur, avg, budgets){
  const bs = budgets || [];
  const mx = niceMax(Math.max(...vals, avg||0, ...bs.map(b=>b||0), 1));
  const grid = [0,.5,1].map(f=>`<div class="gl${f===0?" base":""}" style="bottom:calc(22px + ${f} * (100% - 22px))"><span>${f? short(mx*f):"0"}</span></div>`).join("");
  const cols = months.map((m,i)=>{ const b = bs[i]!=null && bs[i]>=0 ? bs[i] : null, over = b!==null && vals[i]>b;
    return `<button type="button" class="col${m===cur?" cur":""}${over?" over":""}" data-ym="${m}" data-v="${vals[i]}"${b!==null?` data-b="${b}"`:""} aria-label="${ymLabel(m)} ${yen(vals[i])}${b!==null?`、予算 ${yen(b)}`:""}"><div class="b" style="height:${Math.max(0,vals[i])/mx*100}%;--i:${i}"></div>${b>0?`<i class="bdot" style="bottom:${b/mx*100}%"></i>`:""}<span class="x">${Number(m.slice(5))}${months.length>8?"":"月"}</span></button>`; }).join("");
  const av = avg ? `<div class="avg" style="bottom:calc(22px + ${avg/mx} * (100% - 22px))"><span>平均 ${short(avg)}</span></div>` : "";
  // 折れ線：列の中央を結ぶ。予算のない月で線を切る（線は SVG を横に伸ばすので、太さは vector-effect で固定）
  const segs = []; let seg = [];
  months.forEach((m,i) => { const b = bs[i]>0 ? bs[i] : null;
    if (b===null){ if (seg.length) segs.push(seg); seg = []; return; }
    seg.push(`${((i+.5)/months.length*100).toFixed(2)},${(100 - b/mx*100).toFixed(2)}`); });
  if (seg.length) segs.push(seg);
  const bl = segs.some(g=>g.length>1) ? `<svg class="bline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${segs.filter(g=>g.length>1).map(g=>`<polyline points="${g.join(" ")}"/>`).join("")}</svg>` : "";
  const lg = bs.some(b=>b>0) ? `<div class="tlegend" aria-hidden="true"><span class="lb">予算</span>${avg?`<span class="la">平均</span>`:""}</div>` : "";
  return `<div class="trend" id="${id}" data-mx="${mx}">${grid}${av}<div class="cols">${cols}</div>${bl}</div>${lg}`;
}
function catDonut(cats, total){

  const sl = pos.map(([c,v])=>{ const p = v/sum*100, len = Math.max(p-gap, .4);
    const el = `<circle class="sl" cx="21" cy="21" r="15.915" pathLength="100" stroke-width="6" stroke="${ICONS[iconKey(c)]?.[0]||ICONS.tag[0]}" stroke-dasharray="${len.toFixed(2)} 100" stroke-dashoffset="${(-at).toFixed(2)}" data-fcat="${esc(c)}"/>`;
    at += p; return el; }).join("");
  return `<div class="donut"><svg viewBox="0 0 42 42" aria-hidden="true">
    <mask id="dmask"><circle class="sweep" cx="21" cy="21" r="15.915" pathLength="100" stroke="#fff" stroke-width="8" stroke-dasharray="100 100"/></mask>
    <circle class="bgr" cx="21" cy="21" r="15.915" stroke-width="6"/><g mask="url(#dmask)">${sl}</g></svg>
    <div class="ctr"><span>支出</span><b class="num">${yen(total)}</b></div></div>`;
}
function catTrend(ym){
  const first = Object.keys(S.months).sort()[0] || ym;
  const months = Array.from({length:12},(_,i)=>shiftYm(ym,i-11)).filter(m => m>=first || m===ym);
  const sums = {};
  for (const m of months) for (const t of (S.months[m]||[])) { (sums[t.cat] ||= {}); sums[t.cat][m] = (sums[t.cat][m]||0) + t.amount; }
  const cats = Object.keys(sums).filter(c => months.some(m => sums[c][m]))
    .sort((a,b) => (sums[b][ym]||0)-(sums[a][ym]||0) || months.reduce((s,m)=>s+(sums[b][m]||0)-(sums[a][m]||0),0));
  if (!cats.length) return "";
  const sel = cats.includes(S.trendCat) ? S.trendCat : cats[0];
  const vals = months.map(m => sums[sel][m]||0);
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/months.length);
  const cur = sums[sel][ym]||0, prevYm = shiftYm(ym,-1), dv = cur - (sums[sel][prevYm]||0);
  const chips = cats.map(c=>`<button type="button" class="${c===NONE?"none":""}" data-tcat="${esc(c)}" aria-pressed="${c===sel}">${catIcon(c,20)}${esc(catName(c))}</button>`).join("");
  return `<section class="panel"><h2>カテゴリ別の推移<small>棒をタップで金額を表示</small></h2>
    <div class="chips" id="chips">${chips}</div>
    <div class="ctsum"><span>${Number(ym.slice(5))}月 <b class="num">${yen(cur)}</b></span>
      ${months.includes(prevYm) ? `<span>前月差 <b class="num ${dv>0?"up":dv<0?"down":""}">${dv>0?"▲":dv<0?"▼":"±"}${yen(Math.abs(dv))}</b></span>` : ""}
      <span>${months.length}か月平均 <b class="num">${yen(avg)}</b></span></div>
    ${trendChart("ctrend", months, vals, ym, avg, months.map(m => budgetAlloc(m)?.cats[sel] ?? null)).replace('id="ctrend"', `id="ctrend" data-cat="${esc(sel)}"`)}
  </section>`;
}

// カテゴリ別（ドーナツと一覧）とよく使ったお店。月の表示と年の表示で共通
/* ---------- 予算 ---------- */
// その月のカテゴリ別予算：固定した金額を先に取り、残りを直近6か月（その月を含まない・明細のある月）の支出の割合で配分する。
// 単発の大きな出費（家電・旅行など）に引っ張られないよう、明細のある月が3か月以上なら、カテゴリごとにいちばん多い月を1つ除いて平均する
function budgetAlloc(ym){
  const B = S.budget; if (!(B.total>0)) return null;
  const valid = new Set(S.cats.map(c=>c.id));
  const base = [1,2,3,4,5,6].map(k=>shiftYm(ym,-k)).filter(m => (S.months[m]||[]).length).reverse();   // 古い順
  const per = {};   // per[カテゴリ][月の番号] = その月の合計
  base.forEach((m,i) => { for (const t of S.months[m]) if (t.cat!==NONE && valid.has(t.cat)){ (per[t.cat] ||= Array(base.length).fill(0)); per[t.cat][i] += t.amount; } });
  const avg = {};
  for (const [c,arr] of Object.entries(per)){
    const sum = arr.reduce((a,b)=>a+b,0);
    avg[c] = base.length>=3 ? (sum - Math.max(...arr)) / (base.length-1) : sum / base.length;
  }
  const cats = {}; let fsum = 0;
  for (const [c,v] of Object.entries(B.fixed)) if (valid.has(c) && v>=0){ cats[c] = v; fsum += v; }   // 0で固定したカテゴリは自動配分から外れる
  const rest = Math.max(0, B.total - fsum);
  const auto = Object.entries(avg).filter(([c,v]) => v>0 && !(c in cats)).sort((a,b)=>b[1]-a[1]);
  const asum = auto.reduce((a,[,v])=>a+v, 0);
  if (asum>0 && rest>0){
    let used = 0;
    for (const [c,v] of auto){ const a = Math.floor(rest*v/asum/100)*100; cats[c] = a; used += a; }   // 100円単位
    cats[auto[0][0]] += rest - used;                                                                    // 端数はいちばん多いカテゴリへ
  }
  return { total: B.total, cats, base: base.length, baseMonths: base, over: fsum > B.total };
}
function budgetCard(spent, budget, label){
  const left = budget - spent, pct = budget>0 ? Math.min(100, Math.max(0, spent/budget*100)) : 100;
  return `<section class="budget${left<0?" over":""}">
      <div class="bl"><span>${label} <b class="num">${yen(budget)}</b></span><span>${left>=0 ? `残り <b class="num">${yen(left)}</b>` : `<b class="num">▲${yen(-left)}</b>`}</span></div>
      <div class="bbar" role="img" aria-label="予算の${Math.round(spent/budget*100)}%を使いました"><i style="width:${pct}%"></i></div>
    </section>`;
}

function catPanel(txns, total, budgets){
  const by = {}; for (const t of txns) by[t.cat]=(by[t.cat]||0)+t.amount;
  if (budgets) for (const [c,b] of Object.entries(budgets)) if (b>0 && !(c in by)) by[c] = 0;   // 予算があってまだ使っていないカテゴリも出す
  const cats = Object.entries(by).filter(([c,v])=>v!==0 || budgets?.[c]>0).sort((a,b)=>b[1]-a[1]);
  const psum = cats.reduce((s,[,v])=>s+Math.max(0,v),0);
  // 1行にまとめる：アイコンと名前｜予算のバー｜金額（その下に残り/▲。予算がなければ割合）
  // 最初は上位5件だけ。予算を超えたカテゴリは必ず出す。残りは「ほか◯件を表示」で開く（S.catAll）
  const TOP = 5; let hid = 0;
  const cbars = cats.map(([c,v],i)=>{
    const b = budgets && budgets[c]>=0 ? budgets[c] : null, over = b!==null && v>b, hide = !S.catAll && i>=TOP && !over;   // 予算0も「予算あり」
    if (hide) hid++;
    return `<button type="button" class="cbar${c===NONE?" none":""}${b!==null?" hasb":""}${over?" over":""}" data-fcat="${esc(c)}"${hide?" hidden":""} aria-label="${esc(catName(c))} ${yen(v)}${b!==null?`、予算 ${yen(b)}、${over?`${yen(v-b)}超過`:`残り ${yen(b-v)}`}`:""}">`
      + `<span class="n">${catIcon(c,22)}<b>${esc(catName(c))}</b></span>`
      + (b!==null ? `<span class="bbar"><i style="width:${b>0 ? Math.min(100, Math.max(0, v/b*100)) : 100}%"></i></span>` : "")
      + `<span class="v num">${yen(v)}${b!==null ? `<small class="bs">${over?`▲${yen(v-b)}`:`残り ${yen(b-v)}`}</small>` : `<span>${v>0&&psum?Math.round(v/psum*100)+"%":"—"}</span>`}</span></button>`;
  }).join("");
  const more = hid ? `<button type="button" class="catmore" data-catall>ほか${hid}件を表示</button>` : (S.catAll && cats.length>TOP ? `<button type="button" class="catmore" data-catall>少なく表示</button>` : "");
  return `<section class="panel"><h2>カテゴリ別<small>タップで明細へ</small></h2>${catDonut(cats, total)}<div class="cbars">${cbars}</div>${more}</section>`;
}
function shopPanel(txns){
  const bs = {}; for (const t of txns){ const k=t.name; (bs[k] ||= {v:0,n:0}); bs[k].v+=t.amount; bs[k].n++; }
  const shops = Object.entries(bs).sort((a,b)=>b[1].v-a[1].v).slice(0,6);
  return `<section class="panel"><h2>よく使ったお店<small>金額順</small></h2><ul class="shops">${shops.map(([n,o])=>`<li><span>${esc(n)}<span class="c">${o.n}回</span></span><span class="num">${yen(o.v)}</span></li>`).join("")}</ul></section>`;
}
function stripHtml(step, label, pLabel, pAria, pVal, pHas, nLabel, nAria, nVal, nHas, total, opts){
  return `<section class="mstrip">
      <button type="button" class="side prev" data-mnav="${-step}" aria-label="${pAria}"><span class="ml">‹ ${pLabel}</span>${pHas?`<span class="mv num">${yen(pVal)}</span>`:`<span class="mv none">データなし</span>`}</button>
      <div class="center"><div class="lbl">${label}の支出<span class="dd" aria-hidden="true">▾</span></div><div class="val"><span class="yen">¥</span><span id="totv">${total.toLocaleString("ja-JP")}</span></div><select class="mpick" aria-label="${step===12?"年":"月"}を選ぶ">${opts}</select></div>
      <button type="button" class="side next" data-mnav="${step}" aria-label="${nAria}"><span class="ml">${nLabel} ›</span>${nHas?`<span class="mv num">${yen(nVal)}</span>`:`<span class="mv none">データなし</span>`}</button>
    </section>`;
}
// 月・年のプルダウンの選択肢（明細のある月・年と、今の月・年。新しい順）
// 金額は付けない：iPhoneのプルダウンは幅が狭く、「2025年10月　¥123,456」が2行に折り返したため
function monthOptions(cur){
  return [...new Set([...Object.keys(S.months), cur])].sort().reverse()
    .map(m => `<option value="${m}"${m===cur?" selected":""}>${ymLabel(m)}</option>`).join("");
}
function yearOptions(cur){
  return [...new Set([...Object.keys(S.months).map(m=>Number(m.slice(0,4))), cur])].sort((a,b)=>b-a)
    .map(y => `<option value="${y}"${y===cur?" selected":""}>${y}年</option>`).join("");
}
const segHtml = () => `<div class="seg" role="group" aria-label="集計の単位">${[["month","月"],["year","年"]].map(([k,l])=>`<button type="button" data-ov="${k}" aria-pressed="${S.ov===k}">${l}</button>`).join("")}</div>`;
const yearMonths = y => Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,"0")}`);

function renderYear(){
  const ym = S.month, y = Number(ym.slice(0,4)), yms = yearMonths(y);
  const txns = yms.flatMap(m => S.months[m]||[]);
  const vals = yms.map(monthTotal), total = vals.reduce((a,b)=>a+b,0);
  const has = yms.filter(m => (S.months[m]||[]).length);
  const avg = has.length ? Math.round(total/has.length) : 0;
  const yTot = yy => yearMonths(yy).reduce((s,m)=>s+monthTotal(m),0), yHas = yy => yearMonths(yy).some(m => (S.months[m]||[]).length);
  // 前年同期比：今年データのある月と同じ月どうしで比べる
  const prevSame = has.reduce((s,m)=>s+monthTotal(shiftYm(m,-12)),0), prevSameHas = has.some(m => (S.months[shiftYm(m,-12)]||[]).length);
  const d = total - prevSame, dp = prevSame ? Math.round(d/prevSame*100) : null;
  const strip = stripHtml(12, `${y}年`, `${y-1}年`, `前の年（${y-1}年）`, yTot(y-1), yHas(y-1), `${y+1}年`, `次の年（${y+1}年）`, yTot(y+1), yHas(y+1), total, yearOptions(y));
  // 年の予算：明細のある月の分だけ（その月ごとの配分を足し合わせる）
  let ybud = null, ycats = null;
  if (S.budget.total>0 && has.length){ ybud = S.budget.total*has.length; ycats = {};
    for (const m of has){ const a = budgetAlloc(m); for (const [c,v] of Object.entries(a.cats)) ycats[c] = (ycats[c]||0) + v; } }
  $view.innerHTML = segHtml() + strip + (ybud ? budgetCard(total, ybud, `予算（${has.length}か月分）`) : "") + (!txns.length ? `<div class="panel empty">${y}年の明細はありません。<br><br><button class="btn primary" type="button" data-go="import">CSVを取り込む</button></div>` : `
    <div class="meta solo">
      <span><b class="num">${txns.length}</b> 件</span>
      <span>月平均 <b class="num">${yen(avg)}</b>（${has.length}か月）</span>
      ${prevSameHas && prevSame ? `<span>前年同期比 <b class="num delta ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${yen(Math.abs(d))}（${dp>0?"+":""}${dp}%）</b></span>` : ""}
    </div>
    <div class="grid g2">
      ${catPanel(txns, total, ycats)}
      <section class="panel"><h2>${y}年の月ごとの支出<small>棒をタップで金額を表示</small></h2>${trendChart("trend", yms, vals, ym, avg, yms.map(()=>S.budget.total||null))}</section>
      ${shopPanel(txns)}
    </div>`);
  return total;
}

function renderOverview(){

function renderMonth(){
  const ym = S.month, txns = S.months[ym]||[];
  const total = monthTotal(ym), prev = monthTotal(shiftYm(ym,-1));
  const unc = txns.filter(t=>t.cat===NONE);
  const months = Array.from({length:12},(_,i)=>shiftYm(ym,i-11)).filter(m => m>= (Object.keys(S.months).sort()[0]||ym) || m===ym);
  const vals = months.map(m=>monthTotal(m));
  const withData = months.filter(m => (S.months[m]||[]).length);                               // 平均は明細のある月だけで割る
  const mAvg = withData.length ? Math.round(withData.reduce((a,m)=>a+monthTotal(m),0)/withData.length) : 0;
  const heat = catTrend(ym);
  const d = total - prev, dp = prev ? Math.round(d/prev*100) : null, prevN = (S.months[shiftYm(ym,-1)]||[]).length;
  const pym = shiftYm(ym,-1), nym = shiftYm(ym,1), nTot = monthTotal(nym), nN = (S.months[nym]||[]).length;
  const strip = stripHtml(1, ymLabel(ym), `${Number(pym.slice(5))}月`, `前の月（${ymLabel(pym)}）`, prev, prevN, `${Number(nym.slice(5))}月`, `次の月（${ymLabel(nym)}）`, nTot, nN, total, monthOptions(ym));
  const alloc = budgetAlloc(ym);
  $view.innerHTML = segHtml() + strip + (alloc ? budgetCard(total, alloc.total, "予算") : "") + (!txns.length ? `<div class="panel empty">${ymLabel(ym)}の明細はありません。<br><br><button class="btn primary" type="button" data-go="import">CSVを取り込む</button></div>` : `
    <div class="meta solo">
      <span><b class="num">${txns.length}</b> 件</span>
      ${prev && prevN>=5 ? `<span>前月比 <b class="num delta ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${yen(Math.abs(d))}（${dp>0?"+":""}${dp}%）</b></span>` : ""}
      ${unc.length ? `<button type="button" class="chip" data-fcat="none">未分類 ${unc.length}件 を確認</button>` : ""}
    </div>
    <div class="grid g2">

      <section class="panel"><h2>月別の支出<small>棒をタップで金額を表示</small></h2>${trendChart("trend", months, vals, ym, mAvg, months.map(()=>S.budget.total||null))}</section>
      ${heat}
      ${shopPanel(txns)}
    </div>`);
  return total;
}
function showTip(tr, c){
  tr.querySelector(".tip")?.remove(); const r = c.getBoundingClientRect(), tb = tr.getBoundingClientRect(), b = c.querySelector(".b").getBoundingClientRect();
  const v = +c.dataset.v, bg = c.dataset.b ? +c.dataset.b : null;
  const tip = document.createElement("div"); tip.className="tip";
  tip.textContent = `${ymLabel(c.dataset.ym)}　${yen(v)}` + (bg!==null ? `\n予算 ${yen(bg)}` + (v>bg ? `・▲${yen(v-bg)}` : `・残り ${yen(bg-v)}`) : "");
  const mx = +tr.dataset.mx, top = Math.min(b.top, bg>0 && mx ? r.bottom - r.height*bg/mx : Infinity);   // 予算の高さ（列の高さ×予算/上限）
  tip.style.top = (top - tb.top - 6)+"px";   // 棒の先端（予算の線が上ならその線）の上に出す。背の高い棒では見出しにかぶってもよい
  tr.appendChild(tip);
  const w = tip.offsetWidth; let x = r.left - tb.left + r.width/2; x = Math.min(Math.max(x, w/2), tb.width - w/2);
  tip.style.left = x+"px";
}
function bindTip(tr){
  tr.addEventListener("pointerover", e => { const c = e.target.closest(".col"); if (c && e.pointerType==="mouse") showTip(tr, c); });
  tr.addEventListener("pointerleave", e => { if (e.pointerType==="mouse") tr.querySelector(".tip")?.remove(); });
}

        <ol class="steps"><li>ブラウザ（SafariやChrome）で楽天e-NAVIにログインし、「ご利用明細」を開く</li><li>確認したい月を選び、CSVをダウンロードする（iPhoneは「ファイル」アプリの「ダウンロード」に保存されます）</li><li>上の「CSVファイルを選ぶ」から、そのファイルを選ぶ</li></ol>
        <p class="note">利用日を基準に月ごとに集計します。海外利用の「現地利用額」の行は、直前の明細のメモとして取り込みます。</p>

    </div>`;
  const drop = document.getElementById("drop");
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));

  drop.addEventListener("drop", e => { const f=[...(e.dataTransfer?.files||[])]; if (f.length) importFiles(f); });
  document.getElementById("file").addEventListener("change", e => { const f=[...e.target.files]; if (f.length) importFiles(f); e.target.value=""; });
}

/* ---------- AIで分析（集計をAIに貼りやすい文章にしてコピー。アプリからは送信しない） ---------- */
function aiSummary(n, withShops){
  const end = S.month, months = Array.from({length:n}, (_,i) => shiftYm(end, i-(n-1)));
  const has = months.filter(m => (S.months[m]||[]).length);
  const txns = months.flatMap(m => S.months[m]||[]);
  const L = [];
  L.push(`# 家計簿の集計（${ymLabel(months[0])}〜${ymLabel(end)}）`, "");
  if (S.sample) L.push("※架空のサンプルデータです。", "");
  L.push("楽天カードの明細と、現金などの手入力の支出を、カテゴリ別に集計したものです。金額は円で、マイナスは返金です。"
    + (S.budget.total>0 ? "「▲」は予算を超えた金額です。" : ""), "");
  // 月ごと
  L.push("## 月ごとの支出", "");
  for (const m of months){
    const cnt = (S.months[m]||[]).length, tot = monthTotal(m), al = budgetAlloc(m);
    L.push(`- ${ymLabel(m)}：` + (cnt ? `${yen(tot)}（${cnt}件` + (al ? `、予算 ${yen(al.total)}、${tot>al.total ? `▲${yen(tot-al.total)}` : `残り ${yen(al.total-tot)}`}` : "") + "）" : "明細なし"));
  }
  if (has.length) L.push(`- 月平均（明細のある${has.length}か月）：${yen(Math.round(has.reduce((a,m)=>a+monthTotal(m),0)/has.length))}`);
  L.push("");
  // カテゴリ別の表
  const by = {}; for (const m of months) for (const t of (S.months[m]||[])) { (by[t.cat] ||= {}); by[t.cat][m] = (by[t.cat][m]||0) + t.amount; }
  const catIds = Object.keys(by).sort((a,b) => months.reduce((s,m)=>s+(by[b][m]||0)-(by[a][m]||0),0));
  const alEnd = budgetAlloc(end);
  if (catIds.length){
    const col = m => m.replace("-","/");
    L.push("## カテゴリ別の支出（月ごと）", "");
    L.push(`| カテゴリ | ${months.map(col).join(" | ")} | 平均 |${alEnd ? ` 予算（${col(end)}） |` : ""}`);
    L.push(`|---|${months.map(()=>"---:").join("|")}|---:|${alEnd ? "---:|" : ""}`);
    for (const c of catIds){
      const vals = months.map(m => by[c][m]||0), avg = has.length ? Math.round(has.reduce((a,m)=>a+(by[c][m]||0),0)/has.length) : 0;
      L.push(`| ${catName(c)} | ${vals.map(yen).join(" | ")} | ${yen(avg)} |${alEnd ? ` ${c in alEnd.cats ? yen(alEnd.cats[c]) : "—"} |` : ""}`);
    }
    L.push("");
  }
  // 予算の設定
  if (S.budget.total>0){
    const fx = Object.entries(S.budget.fixed).filter(([c]) => S.cats.some(x=>x.id===c));
    L.push("## 予算の設定", "", `- 月の予算：${yen(S.budget.total)}`,
      `- 金額を固定しているカテゴリ：${fx.length ? fx.map(([c,v])=>`${catName(c)} ${yen(v)}`).join("、") : "なし"}`,
      "- それ以外のカテゴリは、直近6か月の支出の割合（各カテゴリのいちばん多い月を除く）で自動配分しています", "");
  }
  // お店（チェックがオンのときだけ）
  if (withShops && txns.length){
    const bs = {}; for (const t of txns){ (bs[t.name] ||= {v:0,n:0,ms:new Set()}); bs[t.name].v += t.amount; bs[t.name].n++; bs[t.name].ms.add(ymOf(t.date)); }
    const top = Object.entries(bs).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
    L.push("## よく使ったお店（期間の合計・上位10）", "", ...top.map(([n,o]) => `- ${n}：${yen(o.v)}（${o.n}回）`), "");
    if (has.length>=2){
      const every = Object.entries(bs).filter(([,o]) => has.every(m => o.ms.has(m))).sort((a,b)=>b[1].v-a[1].v);
      L.push("## 毎月の支払いの候補（明細のあるすべての月に出てくるお店）", "",
        ...(every.length ? every.map(([n,o]) => `- ${n}：月平均 ${yen(Math.round(o.v/has.length))}`) : ["- なし"]), "");
    }
  }
  L.push("## 相談したいこと", "", "上の集計をもとに、次のことを具体的な金額を挙げて教えてください。",
    "1. 支出の傾向と、増えているカテゴリ", "2. 節約できそうなところ", "3. 来月の予算の配分案");
  return L.join("\n");
}

// 画面を左右にスワイプして月を切り替える（概要・明細のみ）
// ・横方向がはっきりしたときだけ反応（縦スクロール中は動かない）
// ・指に少しだけついてくる控えめな動き（薄くはならない）
(() => {
  let sx=0, sy=0, st=0, state="idle", dx=0;   // state: idle / wait / drag / scroll
  const monthTab = () => S.tab==="overview" || S.tab==="list";
  const setX = (x, ms) => {
    $view.style.transition = ms ? `transform ${ms}ms cubic-bezier(.25,.8,.25,1)` : "none";
    $view.style.transform = x ? `translateX(${x}px)` : "";
  };
  const damp = d => Math.sign(d) * Math.min(Math.abs(d)*0.35, 56);   // 最大56pxまで
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    const ok = e.touches.length===1 && monthTab() && !e.target.closest("input,select,textarea,.chips,.tabs,.toast,.top,.sheet,.scrim")
               && t.clientX > 24 && t.clientX < innerWidth-24;   // 画面の端はOSの操作に任せる
    state = ok ? "wait" : "idle"; sx=t.clientX; sy=t.clientY; st=Date.now(); dx=0;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (state==="idle" || state==="scroll") return;
    const t = e.touches[0]; dx = t.clientX-sx; const dy = t.clientY-sy;
    if (state==="wait"){
      if (Math.abs(dy) > 8 && Math.abs(dy) >= Math.abs(dx)*0.6) { state="scroll"; return; }   // 縦の動きが少しでも勝ったら縦スクロール扱い
      if (Math.abs(dx) < 18 || Math.abs(dx) < Math.abs(dy)*2.2) return;                         // 横がはっきりするまで待つ
      state = "drag"; document.querySelectorAll(".tip").forEach(x=>x.remove());
    }
    if (e.cancelable) e.preventDefault();       // 横スワイプ中は縦にスクロールさせない
    if (!reduceMotion()) setX(damp(dx), 0);
  }, {passive:false});
  const finish = cancel => {
    const was = state; state = "idle";
    if (was!=="drag") return;
    const quick = Math.abs(dx)/(Date.now()-st) > 0.5 && Math.abs(dx) > 40;
    if (cancel || (Math.abs(dx) < 80 && !quick)){ setX(0, 180); setTimeout(()=>setX(0,0), 190); return; }   // 元に戻す
    const dir = dx < 0 ? 1 : -1;
    S.month = shiftYm(S.month, dir*navStep()); nextAnim = "month"; render();
    if (reduceMotion()){ setX(0,0); return; }
    setX(dir*28, 0);                                             // 新しい月を進む向きから少しだけ
    requestAnimationFrame(() => requestAnimationFrame(() => { setX(0, 220); setTimeout(()=>setX(0,0), 230); }));
  };
  document.addEventListener("touchend", () => finish(false), {passive:true});
  document.addEventListener("touchcancel", () => finish(true), {passive:true});
})();

  if (t.id==="app-update"){ t.disabled = true; clearTimeout(flushT); flush().finally(() => location.reload()); return; }   // 保存待ちを書き込んでから読み込み直す
  if (t.id==="bk-later"){ LS.set("kkb-backup-snooze", dayStr(new Date())); render(); return; }
  if (t.id==="reset"){
    if (S.armed!=="__reset"){ S.armed="__reset"; render(); return; }
    S.armed=null; for (const ym of Object.keys(S.months)) { delete S.months[ym]; markDirty("m-"+ym); }
    S.cats = DEFAULT_CATS.map(c=>({...c})); S.rules = DEFAULT_RULES.map(r=>({...r})); S.budget = normBudget(null); markDirty("settings");
    S.months = makeSample(); S.sample = true; S.month = latestMonth(); S.importLog=null; toast("すべてのデータを削除しました"); render(); return; }
  if (t.id==="aiView"){ S.aiOpen = !S.aiOpen; render(); return; }
  if (t.id==="aiCopy"){
    const text = aiSummary(S.aiRange, S.aiShops);
    try { await navigator.clipboard.writeText(text); toast("コピーしました。AIアプリに貼り付けてください"); }
    catch(err){   // コピーできない環境では内容を開いて全選択し、手でコピーしてもらう
      S.aiOpen = true; render(); const ta = document.getElementById("aiText"); if (ta){ ta.focus(); ta.select(); }
      toast("自動でコピーできませんでした。表示した内容を長押しして、コピーしてください"); }
    return; }
  if (t.id==="export"){
    const data = JSON.stringify({app:"kakeibo", v:1, exportedAt:new Date().toISOString(), cats:S.cats, rules:S.rules, budget:S.budget, months:S.sample?{}:S.months}, null, 1);
    const name = `kakeibo-backup-${new Date().toISOString().slice(0,10)}.json`;
    let dl = null; try { dl = await window.claude?.use?.("downloads"); } catch(err){}
    if (dl){ try { await dl.save({filename:name, data}); saveBackupAt(); toast("バックアップを保存しました"); render(); } catch(err){ if (err?.code!=="declined") toast("保存できませんでした。もう一度お試しください。"); } }
    else if (!window.claude) {
      const file = new File([data], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        // title や text を渡すと、iPhone の「"ファイル"に保存」で余分なテキストファイルもできるため、ファイルだけを渡す
        try { await navigator.share({files:[file]}); saveBackupAt(); toast("バックアップを書き出しました"); render(); }
        catch(err){ if (err && err.name!=="AbortError") toast("書き出せませんでした。もう一度お試しください。"); }
        return;
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); saveBackupAt(); toast("バックアップを保存しました"); render(); }
    else { document.getElementById("exportbox").innerHTML = `<p class="note">この表示ではファイル保存ができないため、下の内容をコピーして保存してください。</p><textarea readonly style="width:100%;height:120px;font-family:var(--mono);font-size:11px">${esc(data)}</textarea>`; }
    return; }
  if (t.id==="restore-no"){ S.pendingImport=null; render(); return; }
  if (t.id==="restore-ok"){
    const o = S.pendingImport.data; S.pendingImport=null;
    for (const ym of Object.keys(S.months)) markDirty("m-"+ym);
    S.cats = o.cats; S.rules = o.rules||[]; S.budget = normBudget(o.budget); S.months = o.months||{}; S.sample = !Object.keys(S.months).length;
    if (S.sample) S.months = makeSample();
    migrateV2();   // 古いバックアップも今のカテゴリ構成に合わせる
    for (const ym of Object.keys(S.months)) markDirty("m-"+ym);
    markDirty("settings"); S.month = latestMonth(); toast("バックアップから復元しました"); render(); return; }
});

document.addEventListener("keydown", e => { if (e.key==="Escape" && S.pick) closeSheet(); });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.classList.contains("mpick")){ const v = t.value; S.month = v.length===4 ? v + S.month.slice(4) : v; nextAnim = "month"; render(); return; }
  if (t.id==="fcat"){ S.fCat = t.value; render(); return; }
  if (t.id==="learn"){ S.learn = t.checked; return; }
  if (t.id==="aiRange" || t.id==="aiShops"){   // 内容の欄だけ差し替える
    if (t.id==="aiRange") S.aiRange = +t.value; else S.aiShops = t.checked;
    const ta = document.getElementById("aiText"); if (ta) ta.value = aiSummary(S.aiRange, S.aiShops); return; }
  if (t.id==="qall"){ S.qAll = t.checked; const box = document.getElementById("listres"); if (box) box.innerHTML = listResults(); return; }   // 検索欄は作り直さない
  if (t.dataset.cname){ const c = S.cats.find(x=>x.id===t.dataset.cname); const v=t.value.trim(); if (c && v){ c.name=v; markDirty("settings"); } else render(); return; }
  if (t.dataset.rkw!==undefined){ const v=t.value.trim(); if (v){ S.rules[+t.dataset.rkw].kw=v; markDirty("settings"); } else render(); return; }
  if (t.dataset.bfix!==undefined){ if (t.value.trim()==="") delete S.budget.fixed[t.dataset.bfix]; else S.budget.fixed[t.dataset.bfix] = toYenInt(t.value);   // 空欄は自動、0を含む数字は固定
    markDirty("settings"); render(); return; }
  if (t.dataset.rcat!==undefined){ S.rules[+t.dataset.rcat].cat=t.value; markDirty("settings"); return; }
  if (t.id==="restore"){
    const f = t.files[0]; t.value=""; if (!f) return;
    try { const o = JSON.parse(await readText(f)); if (o.app!=="kakeibo" || !Array.isArray(o.cats)) throw 0;
      S.pendingImport = {name:f.name, data:o, count:Object.values(o.months||{}).flat().length}; render(); }
    catch(err){ toast("この家計簿のバックアップファイルではありません"); }
  }
});
let qT=null;
// 検索：入力欄はそのままにして結果だけ差し替える。日本語の変換中（isComposing）は待ち、確定したら反映
function searchUpdate(el){
  const box = document.getElementById(el.id==="q" ? "listres" : "rulebox"); if (!box) return;
  if (el.id==="q"){ S.q = el.value; box.innerHTML = listResults(); } else { S.rq = el.value; box.innerHTML = ruleRows(); }
}
document.addEventListener("input", e => {
  const el = e.target; if (el.id!=="q" && el.id!=="rq") return;
  if (e.isComposing) return;
  clearTimeout(qT); qT = setTimeout(() => searchUpdate(el), 150);
});
document.addEventListener("compositionend", e => {
  const el = e.target; if (el.id!=="q" && el.id!=="rq") return;
  clearTimeout(qT); qT = setTimeout(() => searchUpdate(el), 0);
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id==="addform"){
    const date = document.getElementById("add-date").value, name = document.getElementById("add-name").value.trim(), amount = parseInt(document.getElementById("add-amt").value,10);
    let cat = document.getElementById("add-cat").value; if (!date || !name || isNaN(amount)) return;
    if (S.sample){ S.months = {}; S.sample = false; }
    const locked = cat!=="auto"; if (!locked) cat = classify(name);
    const ym = ymOf(date); (S.months[ym] ||= []).push({id:uid(), date, name, raw:name, amount, cat, src:"manual", locked});
    S.months[ym].sort((a,b)=>b.date.localeCompare(a.date)); markDirty("m-"+ym); S.month = ym;
    toast(`「${name}」${yen(amount)} を追加しました（${catName(cat)}）`); render();
    document.querySelector("details.add").open = true; document.getElementById("add-name").focus(); return;
  }
  if (f.id==="catform"){ const v = document.getElementById("newcat").value.trim(); if (!v) return;
    S.cats.push({id:"c"+Date.now().toString(36), name:v, icon:"tag"}); markDirty("settings"); render(); return; }
  if (f.id==="budgetform"){ S.budget.total = toYenInt(document.getElementById("btotal").value); markDirty("settings"); render();
    toast(S.budget.total ? `月の予算を${yen(S.budget.total)}にしました` : "予算を使わない設定にしました"); return; }
  if (f.id==="ruleform"){ const kw = document.getElementById("newkw").value.trim(), cat = document.getElementById("newrc").value; if (!kw) return;
    const ex = S.rules.find(r=>mkey(r.kw)===mkey(kw)); if (ex) ex.cat=cat; else S.rules.push({kw,cat});
    markDirty("settings"); S.rq=""; render(); toast(`ルール「${kw} → ${catName(cat)}」を追加しました。「再適用」で既存の明細にも反映できます`); return; }
});

/* ---------- boot ---------- */
S.months = makeSample(); S.month = latestMonth();
render();
initStorage();
// 新しいバージョンの確認：sw.js はブラウザのキャッシュを通さずに確認し、開いたとき・裏から戻ったときにも確認する。
// 新しいバージョンに切り替わったら「新しいバージョンがあります｜更新する」を出す（勝手には読み込み直さない）
if ("serviceWorker" in navigator && window.isSecureContext){
  const hadController = !!navigator.serviceWorker.controller;   // 初めて入れたときは知らせない
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || S.updateReady) return;
    S.updateReady = true; render();
  });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible") reg.update().catch(()=>{}); });
  }).catch(()=>{});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

// 引っ張って更新：一番上で下に引っ張って離すと、新しいバージョンを確かめる（利用者の希望）。
// 新しいバージョンがあれば保存待ちを書き込んでから読み直す。なければ「最新のバージョンです」と知らせるだけ。
// 表示は上の小さな案内だけで、画面を動かす演出は付けない
const $ptr = document.getElementById("ptr");
const ptrShow = (text, ready) => { $ptr.textContent = text; $ptr.classList.toggle("ready", !!ready); $ptr.hidden = false; };
const ptrHide = () => { $ptr.hidden = true; };
let ptrBusy = false;
async function pullRefresh(){
  if (ptrBusy) return; ptrBusy = true; ptrShow("確認中…");
  try {
    clearTimeout(flushT); await flush().catch(()=>{});
    if (S.updateReady){ location.reload(); return; }
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration().catch(()=>null) : null;
    if (!reg){ location.reload(); return; }
    try { await Promise.race([reg.update(), new Promise((_,ng) => setTimeout(() => ng(new Error("timeout")), 10000))]); }   // 電波が弱いときに待ち続けない
    catch(e){ ptrHide(); toast("新しいバージョンを確認できませんでした。電波のよい場所でもう一度お試しください。"); return; }
    if (!(reg.installing || reg.waiting)){ const v = await appVersion(); ptrHide(); toast(`最新のバージョンです${v ? `（${v}）` : ""}`, null, null, true); return; }
    ptrShow("新しいバージョンに切り替えています…");
    await new Promise(res => { const t = setTimeout(res, 8000);
      navigator.serviceWorker.addEventListener("controllerchange", () => { clearTimeout(t); res(); }, {once:true}); });
    location.reload();
  } finally { ptrBusy = false; }
}
(() => {
  const TH = 80;   // これ以上引っ張って離すと更新
  let sx=0, sy=0, dy=0, state="idle";   // idle / wait / pull
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    state = (e.touches.length===1 && window.scrollY<=0 && !ptrBusy && !S.pick
             && !e.target.closest("input,select,textarea,.sheet,.scrim,.rulebox,.tabs,.toast,.chips")) ? "wait" : "idle";
    sx = t.clientX; sy = t.clientY; dy = 0;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (state==="idle") return;
    const t = e.touches[0], dx = t.clientX - sx; dy = t.clientY - sy;
    if (state==="wait"){
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { state = "idle"; return; }   // 横の動き（月のスワイプ）はこちらでは扱わない
      if (dy < -4 || window.scrollY > 0) { state = "idle"; return; }
      if (dy > 12 && dy > Math.abs(dx)*1.5) state = "pull"; else return;
    }
    if (dy >= TH) ptrShow("↻ 離すと更新", true); else ptrShow("↓ 引っ張って更新");
  }, {passive:true});
  const end = cancel => { const was = state; state = "idle";
    if (was!=="pull") return;
    if (!cancel && dy >= TH) pullRefresh(); else ptrHide(); };
  document.addEventListener("touchend", () => end(false), {passive:true});
  document.addEventListener("touchcancel", () => end(true), {passive:true});
})();
})();
</script>
